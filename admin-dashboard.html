<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>管理画面 | Just An Anime Review</title>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
background: #f7f7f7;
color: #222;
}

header {
background: #111;
color: white;
}

.header-inner {
max-width: 1100px;
margin: auto;
padding: 18px 20px;
display: flex;
justify-content: space-between;
align-items: center;
}

.logo {
color: white;
text-decoration: none;
font-weight: bold;
}

.logout {
background: transparent;
border: 1px solid #777;
color: white;
padding: 7px 12px;
border-radius: 6px;
cursor: pointer;
}

main {
max-width: 1000px;
margin: auto;
padding: 45px 20px;
}

.box {
background: white;
padding: 30px;
border-radius: 12px;
margin-bottom: 25px;
box-shadow:
0 3px 15px rgba(0,0,0,.07);
}

h1 {
margin-top: 0;
}

h2 {
margin-top: 0;
}

label {
display: block;
margin: 18px 0 7px;
font-weight: bold;
}

input,
textarea {
width: 100%;
padding: 11px;
border: 1px solid #ccc;
border-radius: 7px;
font-size: 15px;
font-family: inherit;
}

textarea {
min-height: 130px;
resize: vertical;
line-height: 1.7;
}

button {
border: none;
padding: 10px 16px;
border-radius: 7px;
cursor: pointer;
font-size: 14px;
}

button:hover {
opacity: .85;
}

.save {
background: #111;
color: white;
}

.cancel {
background: #e5e5e5;
color: #222;
}

.delete {
background: #d33;
color: white;
}

.edit {
background: #e5e5e5;
color: #222;
}

.toggle-on {
background: #222;
color: white;
}

.toggle-off {
background: #e5e5e5;
color: #555;
}

.actions {
display: flex;
gap: 8px;
margin-top: 20px;
flex-wrap: wrap;
}

#message,
#ad-message {
font-weight: bold;
margin-top: 20px;
}

.search {
margin-bottom: 20px;
}

.search input {
padding: 13px;
}

.item {
border: 1px solid #ddd;
padding: 20px;
border-radius: 10px;
margin-top: 15px;
}

.item h3 {
margin-top: 0;
}

.genre {
display: inline-block;
background: #eee;
padding: 4px 9px;
border-radius: 15px;
font-size: 13px;
}

.count {
color: #666;
}

.status {
display: inline-block;
font-size: 13px;
padding: 4px 9px;
border-radius: 15px;
margin-top: 8px;
}

.status-on {
background: #e8f5e9;
color: #26733a;
}

.status-off {
background: #eee;
color: #777;
}

.ad-preview {
margin-top: 15px;
padding: 15px;
border: 1px solid #eee;
border-radius: 8px;
background: #fafafa;
}

.ad-preview img {
display: block;
max-width: 100%;
max-height: 180px;
margin-bottom: 12px;
border-radius: 6px;
}

.ad-link {
color: #06c;
word-break: break-all;
}

#dashboard {
display: none;
}

#login-error {
text-align: center;
padding: 70px 20px;
display: none;
}

.section-title {
margin-bottom: 10px;
}

.help {
color: #777;
font-size: 13px;
line-height: 1.7;
}

hr {
border: 0;
border-top: 1px solid #eee;
margin: 30px 0;
}

</style>

</head>

<body>


<header>

<div class="header-inner">

<a href="index.html"
class="logo">

Just An Anime Review

</a>

<button
id="logout"
class="logout">

ログアウト

</button>

</div>

</header>


<div id="login-error">

<h1>
ログインが必要です
</h1>

<p>
管理者としてログインしてください。
</p>

<a href="admin.html">
管理者ログイン
</a>

</div>


<div id="dashboard">

<main>


<!-- =========================
     アニメ管理
========================= -->

<div class="box">

<h1 id="form-title">
アニメを追加
</h1>

<form id="form">


<label>
作品名
</label>

<input
id="title"
required
placeholder="STEINS;GATE"
>


<label>
ジャンル
</label>

<input
id="genre"
placeholder="SF・タイムリープ"
>


<label>
あらすじ
</label>

<textarea
id="description"
placeholder="あらすじ">
</textarea>


<label>
レビュー
</label>

<textarea
id="review"
placeholder="レビュー">
</textarea>


<label>
公式サイトURL
</label>

<input
type="url"
id="official_url"
placeholder="https://example.com/"
>


<div class="actions">

<button
class="save"
type="submit">

保存

</button>


<button
type="button"
class="cancel"
id="cancel"
style="display:none;">

キャンセル

</button>

</div>


</form>


<p id="message"></p>

</div>



<div class="box">

<h2>
登録済みアニメ
</h2>


<div class="search">

<input
id="search"
placeholder="作品名・ジャンルを検索">

</div>


<div
id="count"
class="count">

</div>


<div id="list">

</div>

</div>



<!-- =========================
     広告管理
========================= -->

<div class="box">

<h1 id="ad-form-title">
広告を追加
</h1>

<p class="help">
ここで登録した広告は、公開サイトで表示・非表示を切り替えられます。
広告が不要な場合は「非表示」にしてください。
</p>


<form id="ad-form">


<label>
企業名・広告主名
</label>

<input
id="company_name"
placeholder="株式会社○○"
>


<label>
広告タイトル
</label>

<input
id="ad-title"
placeholder="○○公式サイト"
>


<label>
広告説明
</label>

<textarea
id="ad-description"
placeholder="広告の説明文">
</textarea>


<label>
広告画像URL
</label>

<input
type="url"
id="image_url"
placeholder="https://example.com/image.jpg"
>

<p class="help">
画像を使用しない場合は空欄で大丈夫です。
</p>


<label>
リンク先URL
</label>

<input
type="url"
id="link_url"
placeholder="https://example.com/"
>


<label>
広告を表示する
</label>

<select
id="is_active"
style="
width:100%;
padding:11px;
border:1px solid #ccc;
border-radius:7px;
font-size:15px;
">

<option value="true">
表示する
</option>

<option value="false">
非表示
</option>

</select>


<div class="actions">

<button
class="save"
type="submit">

広告を保存

</button>


<button
type="button"
class="cancel"
id="ad-cancel"
style="display:none;">

キャンセル

</button>

</div>


</form>


<p id="ad-message"></p>

</div>



<div class="box">

<h2>
登録済み広告
</h2>


<div class="search">

<input
id="ad-search"
placeholder="企業名・広告タイトルを検索">

</div>


<div
id="ad-count"
class="count">

</div>


<div id="ad-list">

</div>

</div>


</main>

</div>



<script>

/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   アニメ関連
========================================= */

let animeData = [];

let editingId = null;


/* =========================================
   広告関連
========================================= */

let advertisementData = [];

let editingAdId = null;


const dashboard =
document.getElementById("dashboard");

const loginError =
document.getElementById("login-error");


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================================
   ログイン確認
========================================= */

async function checkSession() {

const { data } =
await supabaseClient.auth
.getSession();


if (!data.session) {

loginError.style.display =
"block";

dashboard.style.display =
"none";

return;

}


loginError.style.display =
"none";

dashboard.style.display =
"block";


await loadAnime();

await loadAdvertisements();

}


/* =========================================
   アニメ読み込み
========================================= */

async function loadAnime() {

const { data, error } =
await supabaseClient
.from("anime")
.select(
"id,title,genre,description,review,official_url"
)
.order(
"id",
{ ascending: true }
);


if (error) {

console.error(error);

document.getElementById("message")
.textContent =
"アニメ情報の取得に失敗しました。";

return;

}


animeData =
data || [];

renderAnime(animeData);

}


/* =========================================
   アニメ表示
========================================= */

function renderAnime(list) {

const container =
document.getElementById("list");

const count =
document.getElementById("count");


count.textContent =
`${list.length}作品`;


container.innerHTML = "";


if (!list.length) {

container.innerHTML =
"<p>該当する作品はありません。</p>";

return;

}


list.forEach(anime => {

const item =
document.createElement("div");

item.className =
"item";


item.innerHTML = `

<h3>
${escapeHTML(anime.title)}
</h3>

${
anime.genre
?
`<div class="genre">
${escapeHTML(anime.genre)}
</div>`
:
""
}

${
anime.description
?
`<p>
${escapeHTML(anime.description)}
</p>`
:
""
}

<div class="actions">

<button class="edit">
編集
</button>

<button class="delete">
削除
</button>

</div>

`;


item.querySelector(".edit")
.addEventListener(
"click",
() => editAnime(anime)
);


item.querySelector(".delete")
.addEventListener(
"click",
() => deleteAnime(anime.id)
);


container.appendChild(item);

});

}


/* =========================================
   アニメ編集
========================================= */

function editAnime(anime) {

editingId =
anime.id;


document.getElementById("form-title")
.textContent =
"アニメを編集";


document.getElementById("title")
.value =
anime.title || "";


document.getElementById("genre")
.value =
anime.genre || "";


document.getElementById("description")
.value =
anime.description || "";


document.getElementById("review")
.value =
anime.review || "";


document.getElementById("official_url")
.value =
anime.official_url || "";


document.getElementById("cancel")
.style.display =
"inline-block";


window.scrollTo({
top: 0,
behavior: "smooth"
});

}


/* =========================================
   アニメ保存
========================================= */

document.getElementById("form")
.addEventListener(
"submit",
async function(e) {

e.preventDefault();


const values = {

title:
document.getElementById("title")
.value.trim(),

genre:
document.getElementById("genre")
.value.trim(),

description:
document.getElementById("description")
.value.trim(),

review:
document.getElementById("review")
.value.trim(),

official_url:
document.getElementById("official_url")
.value.trim()

};


let result;


if (editingId === null) {

result =
await supabaseClient
.from("anime")
.insert(values);

} else {

result =
await supabaseClient
.from("anime")
.update(values)
.eq("id", editingId);

}


if (result.error) {

document.getElementById("message")
.textContent =
"保存に失敗しました。";

console.error(result.error);

return;

}


document.getElementById("message")
.textContent =
"保存しました。";


resetForm();

await loadAnime();

});


/* =========================================
   アニメ削除
========================================= */

async function deleteAnime(id) {

const ok =
confirm(
"このアニメを削除しますか？"
);


if (!ok) return;


const { error } =
await supabaseClient
.from("anime")
.delete()
.eq("id", id);


if (error) {

console.error(error);

document.getElementById("message")
.textContent =
"削除に失敗しました。";

return;

}


document.getElementById("message")
.textContent =
"削除しました。";


await loadAnime();

}


/* =========================================
   アニメフォームリセット
========================================= */

function resetForm() {

editingId =
null;


document.getElementById("form")
.reset();


document.getElementById("form-title")
.textContent =
"アニメを追加";


document.getElementById("cancel")
.style.display =
"none";

}


document.getElementById("cancel")
.addEventListener(
"click",
resetForm
);


/* =========================================
   アニメ検索
========================================= */

document.getElementById("search")
.addEventListener(
"input",
function() {

const keyword =
this.value
.trim()
.toLowerCase();


const filtered =
animeData.filter(anime => {

return (

(anime.title || "")
.toLowerCase()
.includes(keyword)

||

(anime.genre || "")
.toLowerCase()
.includes(keyword)

||

(anime.description || "")
.toLowerCase()
.includes(keyword)

);

});


renderAnime(filtered);

});


/* =========================================
   広告読み込み
========================================= */

async function loadAdvertisements() {

const { data, error } =
await supabaseClient
.from("advertisements")
.select(
"id,company_name,title,description,image_url,link_url,is_active"
)
.order(
"id",
{ ascending: true }
);


if (error) {

console.error(error);

document.getElementById("ad-message")
.textContent =
"広告情報の取得に失敗しました。";

return;

}


advertisementData =
data || [];

renderAdvertisements(advertisementData);

}


/* =========================================
   広告表示
========================================= */

function renderAdvertisements(list) {

const container =
document.getElementById("ad-list");

const count =
document.getElementById("ad-count");


count.textContent =
`${list.length}件`;


container.innerHTML = "";


if (!list.length) {

container.innerHTML =
"<p>登録されている広告はありません。</p>";

return;

}


list.forEach(ad => {

const item =
document.createElement("div");

item.className =
"item";


const statusClass =
ad.is_active
?
"status-on"
:
"status-off";


const statusText =
ad.is_active
?
"表示中"
:
"非表示";


item.innerHTML = `

<h3>
${escapeHTML(ad.company_name || "広告主未設定")}
</h3>

${
ad.title
?
`<p>
<strong>
${escapeHTML(ad.title)}
</strong>
</p>`
:
""
}

<div class="status ${statusClass}">
${statusText}
</div>

${
ad.description
?
`<p>
${escapeHTML(ad.description)}
</p>`
:
""
}

${
ad.image_url
?
`
<div class="ad-preview">

<img
src="${escapeHTML(ad.image_url)}"
alt="広告画像"
onerror="this.style.display='none';"
>

</div>
`
:
""
}

${
ad.link_url
?
`
<p>
リンク：
<a
class="ad-link"
href="${escapeHTML(ad.link_url)}"
target="_blank"
rel="noopener noreferrer">

${escapeHTML(ad.link_url)}

</a>
</p>
`
:
""
}

<div class="actions">

<button class="edit">
編集
</button>

<button class="${
ad.is_active
?
"toggle-off"
:
"toggle-on"
}">
${
ad.is_active
?
"非表示にする"
:
"表示する"
}
</button>

<button class="delete">
削除
</button>

</div>

`;


item.querySelector(".edit")
.addEventListener(
"click",
() => editAdvertisement(ad)
);


item.querySelector(
ad.is_active
?
".toggle-off"
:
".toggle-on"
)
.addEventListener(
"click",
() =>
toggleAdvertisement(
ad.id,
!ad.is_active
)
);


item.querySelector(".delete")
.addEventListener(
"click",
() =>
deleteAdvertisement(ad.id)
);


container.appendChild(item);

});

}


/* =========================================
   広告編集
========================================= */

function editAdvertisement(ad) {

editingAdId =
ad.id;


document.getElementById("ad-form-title")
.textContent =
"広告を編集";


document.getElementById("company_name")
.value =
ad.company_name || "";


document.getElementById("ad-title")
.value =
ad.title || "";


document.getElementById("ad-description")
.value =
ad.description || "";


document.getElementById("image_url")
.value =
ad.image_url || "";


document.getElementById("link_url")
.value =
ad.link_url || "";


document.getElementById("is_active")
.value =
ad.is_active
?
"true"
:
"false";


document.getElementById("ad-cancel")
.style.display =
"inline-block";


window.scrollTo({
top: document.body.scrollHeight,
behavior: "smooth"
});

}


/* =========================================
   広告保存
========================================= */

document.getElementById("ad-form")
.addEventListener(
"submit",
async function(e) {

e.preventDefault();


const values = {

company_name:
document.getElementById("company_name")
.value.trim(),

title:
document.getElementById("ad-title")
.value.trim(),

description:
document.getElementById("ad-description")
.value.trim(),

image_url:
document.getElementById("image_url")
.value.trim(),

link_url:
document.getElementById("link_url")
.value.trim(),

is_active:
document.getElementById("is_active")
.value === "true"

};


let result;


if (editingAdId === null) {

result =
await supabaseClient
.from("advertisements")
.insert(values);

} else {

result =
await supabaseClient
.from("advertisements")
.update(values)
.eq("id", editingAdId);

}


if (result.error) {

console.error(result.error);

document.getElementById("ad-message")
.textContent =
"広告の保存に失敗しました。";

return;

}


document.getElementById("ad-message")
.textContent =
"広告を保存しました。";


resetAdvertisementForm();

await loadAdvertisements();

});


/* =========================================
   広告削除
========================================= */

async function deleteAdvertisement(id) {

const ok =
confirm(
"この広告を削除しますか？"
);


if (!ok) return;


const { error } =
await supabaseClient
.from("advertisements")
.delete()
.eq("id", id);


if (error) {

console.error(error);

document.getElementById("ad-message")
.textContent =
"広告の削除に失敗しました。";

return;

}


document.getElementById("ad-message")
.textContent =
"広告を削除しました。";


await loadAdvertisements();

}


/* =========================================
   広告表示・非表示
========================================= */

async function toggleAdvertisement(
id,
isActive
) {

const { error } =
await supabaseClient
.from("advertisements")
.update({
is_active: isActive
})
.eq("id", id);


if (error) {

console.error(error);

document.getElementById("ad-message")
.textContent =
"広告の状態変更に失敗しました。";

return;

}


document.getElementById("ad-message")
.textContent =
isActive
?
"広告を表示しました。"
:
"広告を非表示にしました。";


await loadAdvertisements();

}


/* =========================================
   広告フォームリセット
========================================= */

function resetAdvertisementForm() {

editingAdId =
null;


document.getElementById("ad-form")
.reset();


document.getElementById("is_active")
.value =
"false";


document.getElementById("ad-form-title")
.textContent =
"広告を追加";


document.getElementById("ad-cancel")
.style.display =
"none";

}


document.getElementById("ad-cancel")
.addEventListener(
"click",
resetAdvertisementForm
);


/* =========================================
   広告検索
========================================= */

document.getElementById("ad-search")
.addEventListener(
"input",
function() {

const keyword =
this.value
.trim()
.toLowerCase();


const filtered =
advertisementData.filter(ad => {

return (

(ad.company_name || "")
.toLowerCase()
.includes(keyword)

||

(ad.title || "")
.toLowerCase()
.includes(keyword)

||

(ad.description || "")
.toLowerCase()
.includes(keyword)

);

});


renderAdvertisements(filtered);

});


/* =========================================
   ログアウト
========================================= */

document.getElementById("logout")
.addEventListener(
"click",
async function() {

await supabaseClient.auth.signOut();

location.href =
"admin.html";

});


/* =========================================
   セッション監視
========================================= */

supabaseClient.auth
.onAuthStateChange(
(event, session) => {

if (!session) {

loginError.style.display =
"block";

dashboard.style.display =
"none";

}

});


/* =========================================
   起動
========================================= */

checkSession();

</script>

</body>

</html>
