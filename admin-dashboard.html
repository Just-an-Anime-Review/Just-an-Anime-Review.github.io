<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnU-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   データ
===================================================== */

let animeData = [];

let advertisementData = [];

let commentData = [];

let recommendedData = [];

let editingId = null;

let editingAdId = null;

let editingAdImageUrl = "";

let editingRecommendedId = null;


/* =====================================================
   要素
===================================================== */

const dashboard =
document.getElementById("dashboard");

const loginError =
document.getElementById("login-error");


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =====================================================
   URL安全性
===================================================== */

function isSafeURL(url) {

if (!url) return false;

try {

const parsed =
new URL(url);

return (
parsed.protocol === "http:" ||
parsed.protocol === "https:"
);

} catch {

return false;

}

}


/* =====================================================
   日付表示
===================================================== */

function formatDate(date) {

if (!date) return "";

const parts =
String(date).split("-");

if (parts.length !== 3) {
return date;
}

return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;

}


/* =====================================================
   時刻表示
===================================================== */

function formatTime(time) {

if (!time) return "";

return String(time).slice(0,5);

}


/* =====================================================
   ★ 50音順ソート
===================================================== */

/*
   日本語タイトルを基準に50音順で並べます。

   localeCompare("ja") を使用することで、

   あ → か → さ → た → な
   → は → ま → や → ら → わ

   の日本語順で比較します。
*/

const japaneseCollator =
new Intl.Collator(
"ja",
{
sensitivity: "base",
numeric: true
}
);


/*
   タイトルの先頭にある
   空白・括弧・記号などをある程度無視して
   ソートしやすくします。
*/

function getAnimeSortTitle(title) {

return String(title || "")
.trim()
.replace(
/^[「『【［（〈《〔｛（\[\(【『「]+/,
""
)
.normalize("NFKC");

}


/*
   アニメ配列を50音順にする。
*/

function sortAnime50on(list) {

return [...list].sort(
(a, b) => {

const titleA =
getAnimeSortTitle(a.title);

const titleB =
getAnimeSortTitle(b.title);

const result =
japaneseCollator.compare(
titleA,
titleB
);

if (result !== 0) {
return result;
}


/*
   日本語タイトルが同じ場合はID順。
*/

return Number(a.id) - Number(b.id);

});

}


/* =====================================================
   ログイン確認
===================================================== */

async function checkSession() {

const {
data,
error
} =
await supabaseClient.auth.getSession();

if (error) {

console.error(error);

loginError.style.display =
"block";

return;

}

if (!data.session) {

loginError.style.display =
"block";

dashboard.style.display =
"none";

return;

}

loginError.style.display =
"none";

dashboard.style.display =
"block";

await loadAnime();

await loadAdvertisements();

await loadComments();

await loadRecommendedAnime();

}


/* =====================================================
   アニメ取得
===================================================== */

async function loadAnime() {

const {
data,
error
} =
await supabaseClient
.from("anime")
.select(
"id,title,english_title,genre,description,review,official_url"
);

if (error) {

console.error(error);

document.getElementById("message")
.textContent =
"アニメ情報の取得に失敗しました。";

return;

}


/*
   ★ 取得した時点で50音順にする
*/

animeData =
sortAnime50on(
data || []
);

renderAnime(animeData);

populateRecommendedAnimeSelect();

}


/* =====================================================
   アニメ表示
===================================================== */

function renderAnime(list) {

const container =
document.getElementById("list");

const count =
document.getElementById("count");


/*
   ★ 表示する直前にも50音順にする。
   これにより検索結果も50音順になります。
*/

const sortedList =
sortAnime50on(list);

count.textContent =
`${sortedList.length}作品`;

container.innerHTML = "";

if (!sortedList.length) {

container.innerHTML =
"<p>該当する作品はありません。</p>";

return;

}

sortedList.forEach(anime => {

const item =
document.createElement("div");

item.className =
"item";

item.innerHTML = `

<h3>
${escapeHTML(anime.title)}
</h3>

${
anime.english_title
?
`<div class="english-title">
${escapeHTML(anime.english_title)}
</div>`
:
""
}

${
anime.genre
?
`<div class="genre">
${escapeHTML(anime.genre)}
</div>`
:
""
}

${
anime.description
?
`<p>
${escapeHTML(anime.description)}
</p>`
:
""
}

<div class="actions">

<button class="edit">
編集
</button>

<button class="delete">
削除
</button>

</div>
`;

item
.querySelector(".edit")
.addEventListener(
"click",
() => editAnime(anime)
);

item
.querySelector(".delete")
.addEventListener(
"click",
() => deleteAnime(anime.id)
);

container.appendChild(item);

});

}


/* =====================================================
   アニメ編集
===================================================== */

function editAnime(anime) {

editingId =
anime.id;

document.getElementById("form-title")
.textContent =
"アニメを編集";

document.getElementById("title")
.value =
anime.title || "";

document.getElementById("english_title")
.value =
anime.english_title || "";

document.getElementById("genre")
.value =
anime.genre || "";

document.getElementById("description")
.value =
anime.description || "";

document.getElementById("review")
.value =
anime.review || "";

document.getElementById("official_url")
.value =
anime.official_url || "";

document.getElementById("cancel")
.style.display =
"inline-block";

window.scrollTo({
top: 0,
behavior: "smooth"
});

}


/* =====================================================
   アニメ保存
===================================================== */

document
.getElementById("form")
.addEventListener(
"submit",
async function(e) {

e.preventDefault();

const values = {

title:
document.getElementById("title")
.value.trim(),

english_title:
document.getElementById("english_title")
.value.trim(),

genre:
document.getElementById("genre")
.value.trim(),

description:
document.getElementById("description")
.value.trim(),

review:
document.getElementById("review")
.value.trim(),

official_url:
document.getElementById("official_url")
.value.trim()

};

let result;

if (editingId === null) {

result =
await supabaseClient
.from("anime")
.insert(values);

} else {

result =
await supabaseClient
.from("anime")
.update(values)
.eq("id", editingId);

}

if (result.error) {

console.error(result.error);

document.getElementById("message")
.textContent =
"保存に失敗しました。";

return;

}

document.getElementById("message")
.textContent =
"保存しました。";

resetForm();

await loadAnime();

});


/* =====================================================
   アニメ削除
===================================================== */

async function deleteAnime(id) {

if (!confirm("このアニメを削除しますか？")) {
return;
}

const {
error
} =
await supabaseClient
.from("anime")
.delete()
.eq("id", id);

if (error) {

console.error(error);

document.getElementById("message")
.textContent =
"削除に失敗しました。";

return;

}

document.getElementById("message")
.textContent =
"削除しました。";

await loadAnime();

}


/* =====================================================
   アニメフォームリセット
===================================================== */

function resetForm() {

editingId = null;

document
.getElementById("form")
.reset();

document.getElementById("form-title")
.textContent =
"アニメを追加";

document.getElementById("cancel")
.style.display =
"none";

}

document
.getElementById("cancel")
.addEventListener(
"click",
resetForm
);


/* =====================================================
   アニメ検索
===================================================== */

document
.getElementById("search")
.addEventListener(
"input",
function() {

const keyword =
this.value
.trim()
.toLowerCase();

if (!keyword) {

renderAnime(animeData);

return;

}

const filtered =
animeData.filter(anime => {

return (

(anime.title || "")
.toLowerCase()
.includes(keyword)

||

(anime.english_title || "")
.toLowerCase()
.includes(keyword)

||

(anime.genre || "")
.toLowerCase()
.includes(keyword)

||

(anime.description || "")
.toLowerCase()
.includes(keyword)

);

});


/*
   ★ 検索結果も50音順
*/

renderAnime(
sortAnime50on(filtered)
);

});


/* =====================================================
   おすすめ選択肢
===================================================== */

function populateRecommendedAnimeSelect() {

const select =
document.getElementById(
"recommend-anime"
);

const currentValue =
select.value;

select.innerHTML = `

<option value="">
アニメを選択してください
</option>

`;


/*
   ★ おすすめ選択欄も50音順
*/

const sortedAnime =
sortAnime50on(
animeData
);

sortedAnime.forEach(anime => {

const option =
document.createElement("option");

option.value =
anime.id;

option.textContent =
anime.title;

select.appendChild(option);

});

if (currentValue) {

select.value =
currentValue;

}

}


/* =====================================================
   おすすめ取得
===================================================== */

async function loadRecommendedAnime() {

const {
data,
error
} =
await supabaseClient
.from("recommended_anime")
.select(
"id,anime_id,start_date,end_date,start_time,end_time,display_order,is_active,created_at,updated_at"
)
.order(
"display_order",
{
ascending: true
}
)
.order(
"start_date",
{

/* =====================================================

===================================================== */

document
.getElementById("ad-form")
.addEventListener(
"submit",
async function(e) {

e.preventDefault();

const adMessage =
document.getElementById(
"ad-message"
);

const submitButton =
document.querySelector(
"#ad-form button[type='submit']"
);

const companyName =
document.getElementById(
"company_name"
).value.trim();

const title =
document.getElementById(
"ad-title"
).value.trim();

const description =
document.getElementById(
"ad-description"
).value.trim();

const linkUrl =
document.getElementById(
"link_url"
).value.trim();

const isActive =
document.getElementById(
"is_active"
).value ===
"true";

const fileInput =
document.getElementById(
"image_file"
);

const file =
fileInput.files[0] || null;

submitButton.disabled = true;

adMessage.textContent =
"広告を保存しています……";

try {

const {
data: sessionData
} =
await supabaseClient.auth
.getSession();

if (!sessionData.session) {

throw new Error(
"ログインセッションがありません。"
);

}

let imageUrl =
editingAdImageUrl || "";

if (file) {

const allowedTypes = [
"image/jpeg",
"image/png",
"image/webp",
"image/gif"
];

if (!allowedTypes.includes(file.type)) {

throw new Error(
"JPEG・PNG・WebP・GIFの画像を選択してください。"
);

}

if (file.size > 10 * 1024 * 1024) {

throw new Error(
"画像サイズは10MB以下にしてください。"
);

}

const extension =
file.name
.split(".")
.pop()
.toLowerCase();

const fileName =
`${crypto.randomUUID()}.${extension}`;

const filePath =
`ads/${fileName}`;

const {
error: uploadError
} =
await supabaseClient.storage
.from("advertisements")
.upload(
filePath,
file,
{
cacheControl: "3600",
upsert: false,
contentType: file.type
}
);

if (uploadError) {

throw uploadError;

}

const {
data: publicUrlData
} =
supabaseClient.storage
.from("advertisements")
.getPublicUrl(
filePath
);

imageUrl =
publicUrlData.publicUrl;

}

const values = {

company_name:
companyName,

title:
title,

description:
description,

image_url:
imageUrl,

link_url:
linkUrl,

is_active:
isActive

};

let result;

if (editingAdId === null) {

result =
await supabaseClient
.from("advertisements")
.insert(values);

} else {

result =
await supabaseClient
.from("advertisements")
.update(values)
.eq("id", editingAdId);

}

if (result.error) {

throw result.error;

}

adMessage.textContent =
"広告を保存しました。";

resetAdvertisementForm();

await loadAdvertisements();

} catch (error) {

console.error(
"広告保存エラー:",
error
);

adMessage.textContent =
error.message ||
"広告の保存に失敗しました。";

} finally {

submitButton.disabled = false;

}

});

document.getElementById(
"current-image"
).textContent =
"新しい画像を選択しています。保存するとアップロードされます。";

};

reader.readAsDataURL(file);

});


/* =====================================================
   広告検索
===================================================== */

document
.getElementById("ad-search")
.addEventListener(
"input",
function() {

const keyword =
this.value
.trim()
.toLowerCase();

if (!keyword) {

renderAdvertisements(
advertisementData
);

return;

}

const filtered =
advertisementData.filter(
ad => {

return (

(ad.company_name || "")
.toLowerCase()
.includes(keyword)

||

(ad.title || "")
.toLowerCase()
.includes(keyword)

||

(ad.description || "")
.toLowerCase()
.includes(keyword)

);

});

renderAdvertisements(filtered);

});


/* =====================================================
   ログアウト
===================================================== */

document
.getElementById("logout")
.addEventListener(
"click",
async function() {

await supabaseClient.auth.signOut();

location.href =
"admin.html";

});


/* =====================================================
   セッション監視
===================================================== */

supabaseClient.auth
.onAuthStateChange(
(event, session) => {

if (!session) {

loginError.style.display =
"block";

dashboard.style.display =
"none";

}

});


/* =====================================================
   起動
===================================================== */

checkSession();
