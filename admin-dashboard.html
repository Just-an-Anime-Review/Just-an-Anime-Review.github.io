<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>アニメ管理 | Just An Anime Review</title>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
background: #f7f7f7;
color: #222;
}

header {
background: #111;
color: white;
}

.header-inner {
max-width: 1100px;
margin: auto;
padding: 18px 20px;
display: flex;
justify-content: space-between;
align-items: center;
}

.logo {
color: white;
text-decoration: none;
font-weight: bold;
}

.logout {
background: transparent;
border: 1px solid #777;
color: white;
padding: 7px 12px;
border-radius: 6px;
cursor: pointer;
}

main {
max-width: 1000px;
margin: auto;
padding: 45px 20px;
}

.box {
background: white;
padding: 30px;
border-radius: 12px;
margin-bottom: 25px;
box-shadow:
0 3px 15px rgba(0,0,0,.07);
}

h1 {
margin-top: 0;
}

label {
display: block;
margin: 18px 0 7px;
font-weight: bold;
}

input,
textarea {
width: 100%;
padding: 11px;
border: 1px solid #ccc;
border-radius: 7px;
font-size: 15px;
font-family: inherit;
}

textarea {
min-height: 130px;
resize: vertical;
line-height: 1.7;
}

button {
border: none;
padding: 10px 16px;
border-radius: 7px;
cursor: pointer;
}

.save {
background: #111;
color: white;
}

.cancel {
background: #e5e5e5;
}

.delete {
background: #d33;
color: white;
}

.edit {
background: #e5e5e5;
}

.actions {
display: flex;
gap: 8px;
margin-top: 20px;
flex-wrap: wrap;
}

#message {
font-weight: bold;
}

.search {
margin-bottom: 20px;
}

.search input {
padding: 13px;
}

.item {
border: 1px solid #ddd;
padding: 20px;
border-radius: 10px;
margin-top: 15px;
}

.item h3 {
margin-top: 0;
}

.genre {
display: inline-block;
background: #eee;
padding: 4px 9px;
border-radius: 15px;
font-size: 13px;
}

.count {
color: #666;
}

#dashboard {
display: none;
}

#login-error {
text-align: center;
padding: 70px 20px;
display: none;
}

</style>

</head>

<body>

<header>

<div class="header-inner">

<a href="index.html"
class="logo">

Just An Anime Review

</a>

<button
id="logout"
class="logout">

ログアウト

</button>

</div>

</header>


<div id="login-error">

<h1>
ログインが必要です
</h1>

<p>
管理者としてログインしてください。
</p>

<a href="admin.html">
管理者ログイン
</a>

</div>


<div id="dashboard">

<main>


<div class="box">

<h1 id="form-title">
アニメを追加
</h1>


<form id="form">

<label>
作品名
</label>

<input
id="title"
required
placeholder="STEINS;GATE"
>


<label>
ジャンル
</label>

<input
id="genre"
placeholder="SF・タイムリープ"
>


<label>
あらすじ
</label>

<textarea
id="description"
placeholder="あらすじ">
</textarea>


<label>
レビュー
</label>

<textarea
id="review"
placeholder="レビュー">
</textarea>


<label>
公式サイトURL
</label>

<input
type="url"
id="official_url"
placeholder="https://example.com/"
>


<div class="actions">

<button
class="save"
type="submit">

保存

</button>


<button
type="button"
class="cancel"
id="cancel"
style="display:none;">

キャンセル

</button>

</div>


</form>


<p id="message"></p>

</div>



<div class="box">

<h2>
登録済みアニメ
</h2>


<div class="search">

<input
id="search"
placeholder="作品を検索">
</div>


<div
id="count"
class="count">

</div>


<div id="list">

</div>

</div>


</main>

</div>


<script>

const SUPABASE_URL =
"ここにProject URL";

const SUPABASE_KEY =
"ここにPublishable key";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let animeData = [];

let editingId = null;


const dashboard =
document.getElementById("dashboard");

const loginError =
document.getElementById("login-error");


function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


async function checkSession() {

const { data } =
await supabaseClient.auth
.getSession();


if (!data.session) {

loginError.style.display =
"block";

return;

}


dashboard.style.display =
"block";


loadAnime();

}


async function loadAnime() {

const { data, error } =
await supabaseClient
.from("anime")
.select(
"id,title,genre,description,review,official_url"
)
.order(
"id",
{ ascending: true }
);


if (error) {

console.error(error);

return;

}


animeData =
data || [];

renderAnime(animeData);

}


function renderAnime(list) {

const container =
document.getElementById("list");

const count =
document.getElementById("count");


count.textContent =
`${list.length}作品`;


container.innerHTML = "";


if (!list.length) {

container.innerHTML =
"<p>該当する作品はありません。</p>";

return;

}


list.forEach(anime => {

const item =
document.createElement("div");

item.className =
"item";


item.innerHTML = `

<h3>
${escapeHTML(anime.title)}
</h3>

${
anime.genre
?
`<div class="genre">
${escapeHTML(anime.genre)}
</div>`
:
""
}

${
anime.description
?
`<p>
${escapeHTML(anime.description)}
</p>`
:
""
}

<div class="actions">

<button class="edit">
編集
</button>

<button class="delete">
削除
</button>

</div>

`;


item.querySelector(".edit")
.addEventListener(
"click",
() => editAnime(anime)
);


item.querySelector(".delete")
.addEventListener(
"click",
() => deleteAnime(anime.id)
);


container.appendChild(item);

});

}


function editAnime(anime) {

editingId =
anime.id;


document.getElementById("form-title")
.textContent =
"アニメを編集";


document.getElementById("title")
.value =
anime.title || "";


document.getElementById("genre")
.value =
anime.genre || "";


document.getElementById("description")
.value =
anime.description || "";


document.getElementById("review")
.value =
anime.review || "";


document.getElementById("official_url")
.value =
anime.official_url || "";


document.getElementById("cancel")
.style.display =
"inline-block";


window.scrollTo({
top: 0,
behavior: "smooth"
});

}


document.getElementById("form")
.addEventListener(
"submit",
async function(e) {

e.preventDefault();


const values = {

title:
document.getElementById("title")
.value.trim(),

genre:
document.getElementById("genre")
.value.trim(),

description:
document.getElementById("description")
.value.trim(),

review:
document.getElementById("review")
.value.trim(),

official_url:
document.getElementById("official_url")
.value.trim()

};


let result;


if (editingId === null) {

result =
await supabaseClient
.from("anime")
.insert(values);

} else {

result =
await supabaseClient
.from("anime")
.update(values)
.eq("id",editingId);

}


if (result.error) {

document.getElementById("message")
.textContent =
"保存に失敗しました。";

console.error(result.error);

return;

}


document.getElementById("message")
.textContent =
"保存しました。";


resetForm();

loadAnime();

});


async function deleteAnime(id) {

const ok =
confirm(
"このアニメを削除しますか？"
);


if (!ok) return;


const { error } =
await supabaseClient
.from("anime")
.delete()
.eq("id",id);


if (error) {

console.error(error);

document.getElementById("message")
.textContent =
"削除に失敗しました。";

return;

}


document.getElementById("message")
.textContent =
"削除しました。";


loadAnime();

}


function resetForm() {

editingId =
null;


document.getElementById("form")
.reset();


document.getElementById("form-title")
.textContent =
"アニメを追加";


document.getElementById("cancel")
.style.display =
"none";

}


document.getElementById("cancel")
.addEventListener(
"click",
resetForm
);


document.getElementById("search")
.addEventListener(
"input",
function() {

const keyword =
this.value
.trim()
.toLowerCase();


const filtered =
animeData.filter(anime => {

return (

(anime.title || "")
.toLowerCase()
.includes(keyword)

||

(anime.genre || "")
.toLowerCase()
.includes(keyword)

);

});


renderAnime(filtered);

});


document.getElementById("logout")
.addEventListener(
"click",
async function() {

await supabaseClient.auth.signOut();

location.href =
"admin.html";

});


supabaseClient.auth
.onAuthStateChange(
(event,session) => {

if (!session) {

loginError.style.display =
"block";

dashboard.style.display =
"none";

}

});


checkSession();

</script>

</body>

</html>
