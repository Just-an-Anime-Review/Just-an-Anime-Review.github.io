<main>


<section class="page-header">

<a
href="admin.html"
class="admin-link">

管理画面

</a>


<script>

/* =========================
   Supabase設定
========================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   アニメデータ
========================= */

let animeData = [];


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================
   アニメ表示
========================= */

function renderAnime(list) {

const container =
document.getElementById("anime-list");

const count =
document.getElementById("count");


count.textContent =
`${list.length}作品`;


if (!list.length) {

container.innerHTML = `

<div class="status">

該当する作品がありません。

</div>

`;

return;

}


container.innerHTML = "";


list.forEach(anime => {

const card =
document.createElement("a");

card.className =
"anime-card";


card.href =
`anime-detail.html?id=${encodeURIComponent(anime.id)}`;


card.innerHTML = `

<h2>
${escapeHTML(anime.title)}
</h2>

${
anime.genre
?
`

<div class="genre">

${escapeHTML(anime.genre)}

</div>

`
:
""
}

${
anime.description
?
`

<p class="description">

${escapeHTML(anime.description)}

</p>

`
:
""
}

<div class="detail">

詳細を見る →

</div>

`;


container.appendChild(card);

});

}


/* =========================
   アニメ取得
========================= */

async function loadAnime() {

const container =
document.getElementById("anime-list");


const { data, error } =
await supabaseClient
.from("anime")
.select(
"id,title,genre,description,review,official_url"
)
.order(
"id",
{ ascending: true }
);


if (error) {

console.error(
"アニメ取得エラー:",
error
);

container.innerHTML = `

<div class="status">

アニメ情報を取得できませんでした。

</div>

`;

return;

}


animeData =
data || [];


renderAnime(animeData);

}


/* =========================
   広告取得
========================= */

async function loadAdvertisement() {

const section =
document.getElementById("ad-section");

const container =
document.getElementById("ad-container");


const { data, error } =
await supabaseClient
.from("advertisements")
.select(
"id,company_name,title,description,image_url,link_url"
)
.eq(
"is_active",
true
)
.order(
"id",
{ ascending: true }
)
.limit(1);


if (error) {

console.error(
"広告取得エラー:",
error
);

section.style.display =
"none";

return;

}


/* 広告がなければ非表示 */

if (!data || data.length === 0) {

section.style.display =
"none";

return;

}


const ad =
data[0];


let html = "";


/* 画像 */

if (ad.image_url) {

html += `

<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(ad.title || "広告")}"
onerror="this.style.display='none';"
>

`;

}


/* 企業名 */

if (ad.company_name) {

html += `

<div class="ad-company">

${escapeHTML(ad.company_name)}

</div>

`;

}


/* タイトル */

if (ad.title) {

html += `

<div class="ad-title">

${escapeHTML(ad.title)}

</div>

`;

}


/* 説明 */

if (ad.description) {

html += `

<div class="ad-description">

${escapeHTML(ad.description)}

</div>

`;

}


/* リンク */

if (ad.link_url) {

html += `

<a
class="ad-button"
href="${escapeHTML(ad.link_url)}"
target="_blank"
rel="noopener noreferrer">

詳しくはこちら

</a>

`;

}


container.innerHTML =
html;


/* 広告を表示 */

section.style.display =
"block";

}


/* =========================
   検索
========================= */

document
.getElementById("search")
.addEventListener(
"input",
function() {


const keyword =
this.value
.trim()
.toLowerCase();


const filtered =
animeData.filter(anime => {


return (

(anime.title || "")
.toLowerCase()
.includes(keyword)

||

(anime.genre || "")
.toLowerCase()
.includes(keyword)

);


});


renderAnime(filtered);

});


/* =========================
   ページ起動
========================= */

loadAnime();

loadAdvertisement();

</script>
