<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   データ
========================= */

let animeData = [];


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================
   検索文字列の正規化
========================= */

function normalizeText(text) {

return String(text ?? "")
.normalize("NFKC")
.toLocaleLowerCase("ja-JP")
.trim()
.replace(/\s+/g, " ");

}


/* =========================
   URL安全性チェック
========================= */

function getSafeURL(url) {

if (!url) {
return "";
}

try {

const parsed =
new URL(url, window.location.origin);

if (
parsed.protocol === "https:" ||
parsed.protocol === "http:"
) {

return parsed.href;

}

return "";

} catch {

return "";

}

}


/* =========================
   ジャンル処理
========================= */

function getGenres(genre) {

if (!genre) {
return [];
}

/*
   「,」「、」「/」「・」「|」などで
   複数ジャンルが登録されている場合にも対応
*/

return String(genre)
.split(/[,、/・|]/)
.map(item => item.trim())
.filter(Boolean);

}


/* =========================
   アニメカード生成
========================= */

function createAnimeCard(anime) {

const card =
document.createElement("a");

card.className =
"anime-card";

card.href =
`anime-detail.html?id=${encodeURIComponent(anime.id)}`;

const title =
escapeHTML(anime.title);

const englishTitle =
escapeHTML(anime.english_title);

const description =
escapeHTML(anime.description);

let genresHTML = "";

const genres =
getGenres(anime.genre);

if (genres.length) {

genresHTML = `

<div class="genre-list">

${genres.map(genre => `

<span class="genre">
${escapeHTML(genre)}
</span>

`).join("")}

</div>

`;

}

card.innerHTML = `

<h2>
${title}
</h2>

${
englishTitle
?
`
<div class="english-title">
${englishTitle}
</div>
`
:
""
}

${genresHTML}

${
description
?
`
<p class="description">
${description}
</p>
`
:
""
}

<div class="detail">
詳細を見る →
</div>

`;

return card;

}


/* =========================
   アニメ表示
========================= */

function renderAnime(list) {

const container =
document.getElementById("anime-list");

const count =
document.getElementById("count");

count.textContent =
`${list.length}作品`;

container.innerHTML = "";

if (!list.length) {

const status =
document.createElement("div");

status.className =
"status";

status.textContent =
"該当する作品がありません。";

container.appendChild(status);

return;

}

const fragment =
document.createDocumentFragment();

list.forEach(anime => {

fragment.appendChild(
createAnimeCard(anime)
);

});

container.appendChild(fragment);


/*
   検索結果に応じて構造化データを更新
*/

updateStructuredData(list);

}


/* =========================
   構造化データ
========================= */

function updateStructuredData(list) {

const schemaElement =
document.getElementById(
"item-list-schema"
);

if (!schemaElement) {
return;
}

const items =
list.map((anime, index) => {

const item = {

"@type": "ListItem",

"position": index + 1,

"name": anime.title || "",

"url":
`${window.location.origin}/anime-detail.html?id=${encodeURIComponent(anime.id)}`

};

return item;

});

const schema = {

"@context": "https://schema.org",

"@type": "ItemList",

"name":
"Just An Anime Review アニメ一覧",

"itemListElement":
items

};

schemaElement.textContent =
JSON.stringify(schema);

}


/* =========================
   アニメ取得
========================= */

async function loadAnime() {

const container =
document.getElementById("anime-list");

const count =
document.getElementById("count");


const { data, error } =
await supabaseClient
.from("anime")
.select(
"id,title,english_title,genre,description,review,official_url"
)
.order(
"id",
{ ascending: true }
);


if (error) {

console.error(
"アニメ取得エラー:",
error
);

count.textContent =
"読み込みエラー";

container.innerHTML = `

<div class="status">

アニメ情報を取得できませんでした。<br>
時間をおいて再度お試しください。

</div>

`;

return;

}


animeData =
Array.isArray(data)
?
data
:
[];


renderAnime(animeData);

}


/* =========================
   検索スコア
========================= */

function getSearchScore(
anime,
keyword
) {

const title =
normalizeText(anime.title);

const english =
normalizeText(anime.english_title);

const genre =
normalizeText(anime.genre);

const description =
normalizeText(anime.description);


/*
   完全一致
*/

if (title === keyword)
return 1000;

if (english === keyword)
return 950;

if (genre === keyword)
return 900;


/*
   日本語タイトル先頭一致
*/

if (title.startsWith(keyword))
return 850;


/*
   英語タイトル先頭一致
*/

if (english.startsWith(keyword))
return 800;


/*
   ジャンル先頭一致
*/

if (genre.startsWith(keyword))
return 700;


/*
   タイトル部分一致
*/

if (title.includes(keyword))
return 600;

if (english.includes(keyword))
return 550;


/*
   ジャンル部分一致
*/

if (genre.includes(keyword))
return 400;


/*
   説明文
*/

if (description.includes(keyword))
return 200;


return 0;

}


/* =========================
   検索実行
========================= */

function searchAnime(keyword) {

const normalizedKeyword =
normalizeText(keyword);


/*
   検索欄が空の場合
*/

if (!normalizedKeyword) {

renderAnime(animeData);

return;

}


/*
   スコアをつけて並び替え
*/

const filtered =
animeData
.map(anime => {

return {

anime: anime,

score:
getSearchScore(
anime,
normalizedKeyword
)

};

})
.filter(item =>
item.score > 0
)
.sort((a, b) => {

if (b.score !== a.score) {

return b.score - a.score;

}


/*
   同じスコアならタイトル順
*/

return normalizeText(
a.anime.title
).localeCompare(
normalizeText(b.anime.title),
"ja"
);

})
.map(item =>
item.anime
);


renderAnime(filtered);

}


/* =========================
   検索イベント
========================= */

const searchInput =
document.getElementById("search");

const searchClear =
document.getElementById("search-clear");


searchInput.addEventListener(
"input",
function() {

searchAnime(this.value);

searchClear.style.display =
this.value
?
"block"
:
"none";

});


searchClear.addEventListener(
"click",
function() {

searchInput.value = "";

searchAnime("");

this.style.display =
"none";

searchInput.focus();

});


/* =========================
   広告取得
========================= */

async function loadAdvertisement() {

const section =
document.getElementById("ad-section");

const container =
document.getElementById("ad-container");


const { data, error } =
await supabaseClient
.from("advertisements")
.select(
"id,company_name,title,description,image_url,link_url"
)
.eq(
"is_active",
true
)
.order(
"id",
{ ascending: true }
)
.limit(1);


if (error) {

console.error(
"広告取得エラー:",
error
);

section.style.display =
"none";

return;

}


if (
!data ||
data.length === 0
) {

section.style.display =
"none";

return;

}


const ad =
data[0];

let html = "";


/*
   画像
*/

if (ad.image_url) {

const imageURL =
getSafeURL(ad.image_url);

if (imageURL) {

html += `

<img
src="${escapeHTML(imageURL)}"
alt="${escapeHTML(
ad.title || "広告"
)}"
loading="lazy"
onerror="this.style.display='none';"
>

`;

}

}


/*
   企業名
*/

if (ad.company_name) {

html += `

<div class="ad-company">
${escapeHTML(
ad.company_name
)}
</div>

`;

}


/*
   タイトル
*/

if (ad.title) {

html += `

<div class="ad-title">
${escapeHTML(
ad.title
)}
</div>

`;

}


/*
   説明
*/

if (ad.description) {

html += `

<div class="ad-description">
${escapeHTML(
ad.description
)}
</div>

`;

}


/*
   リンク
*/

const safeLink =
getSafeURL(ad.link_url);

if (safeLink) {

html += `

<a
class="ad-button"
href="${escapeHTML(
safeLink
)}"
target="_blank"
rel="noopener noreferrer nofollow">

詳しくはこちら

</a>

`;

}


/*
   内容が空の場合は広告を表示しない
*/

if (!html.trim()) {

section.style.display =
"none";

return;

}


container.innerHTML =
html;


/*
   広告表示
*/

section.style.display =
"block";

}


/* =========================
   起動
========================= */

document.addEventListener(
"DOMContentLoaded",
function() {

loadAnime();

loadAdvertisement();

});

</script>

</body>
