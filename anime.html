<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>アニメ一覧 | Just An Anime Review</title>

<meta name="description"
content="Just An Anime Reviewのアニメ作品一覧。">

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
background: #f7f7f7;
color: #222;
}

header {
background: #111;
color: white;
}

.header-inner {
max-width: 1100px;
margin: auto;
padding: 20px;
}

.logo {
color: white;
text-decoration: none;
font-weight: bold;
font-size: 21px;
}

main {
max-width: 1100px;
margin: auto;
padding: 45px 20px;
}

.page-header h1 {
font-size: 36px;
}

.page-header p {
color: #666;
}

.search-box {
margin: 30px 0;
}

.search-box input {
width: 100%;
padding: 14px;
font-size: 16px;
border: 1px solid #ccc;
border-radius: 8px;
}

.count {
margin-bottom: 20px;
color: #666;
}

#anime-list {
display: grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap: 22px;
}

.anime-card {
display: block;
background: white;
padding: 25px;
border-radius: 12px;
text-decoration: none;
color: #222;
box-shadow:
0 3px 15px rgba(0,0,0,.07);
transition: .2s;
}

.anime-card:hover {
transform: translateY(-4px);
}

.anime-card h2 {
margin-top: 0;
}

.genre {
display: inline-block;
background: #eee;
padding: 5px 10px;
border-radius: 20px;
font-size: 13px;
}

.description {
color: #555;
line-height: 1.8;
}

.detail {
color: #06c;
font-weight: bold;
}

.status {
text-align: center;
padding: 40px;
color: #666;
}

footer {
margin-top: 70px;
background: #111;
color: white;
padding: 35px 20px;
}

.footer-inner {
max-width: 1100px;
margin: auto;
}

.admin-link {
position: fixed;
right: 12px;
bottom: 10px;
font-size: 11px;
color: #999;
text-decoration: none;
}

</style>

</head>

<body>

<header>

<div class="header-inner">

<a href="index.html"
class="logo">

Just An Anime Review

</a>

</div>

</header>


<main>

<section class="page-header">

<h1>
アニメ一覧
</h1>

<p>
登録されているアニメ作品をご覧いただけます。
</p>

</section>


<div class="search-box">

<input
type="search"
id="search"
placeholder="作品名・ジャンルを検索">

</div>


<div id="count"
class="count">

読み込み中……

</div>


<div id="anime-list">

<div class="status">
アニメ情報を読み込んでいます……
</div>

</div>

</main>


<footer>

<div class="footer-inner">

<h2>
Just An Anime Review
</h2>

<p>
アニメをもっと深く、もっと面白く。
</p>

</div>

</footer>


<a href="admin.html"
class="admin-link">

管理画面

</a>


<script>

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let animeData = [];


function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


function renderAnime(list) {

const container =
document.getElementById("anime-list");

const count =
document.getElementById("count");

count.textContent =
`${list.length}作品`;


if (!list.length) {

container.innerHTML = `
<div class="status">
該当する作品がありません。
</div>
`;

return;

}


container.innerHTML = "";


list.forEach(anime => {

const card =
document.createElement("a");

card.className =
"anime-card";

card.href =
`anime-detail.html?id=${encodeURIComponent(anime.id)}`;

card.innerHTML = `

<h2>
${escapeHTML(anime.title)}
</h2>

${
anime.genre
?
`<div class="genre">
${escapeHTML(anime.genre)}
</div>`
:
""
}

${
anime.description
?
`<p class="description">
${escapeHTML(anime.description)}
</p>`
:
""
}

<div class="detail">
詳細を見る →
</div>

`;

container.appendChild(card);

});

}


async function loadAnime() {

const container =
document.getElementById("anime-list");


const { data, error } =
await supabaseClient
.from("anime")
.select(
"id,title,genre,description,review,official_url"
)
.order(
"id",
{ ascending: true }
);


if (error) {

console.error(error);

container.innerHTML = `
<div class="status">
アニメ情報を取得できませんでした。
</div>
`;

return;

}


animeData =
data || [];

renderAnime(animeData);

}


document
.getElementById("search")
.addEventListener(
"input",
function() {

const keyword =
this.value
.trim()
.toLowerCase();

const filtered =
animeData.filter(anime => {

return (

(anime.title || "")
.toLowerCase()
.includes(keyword)

||

(anime.genre || "")
.toLowerCase()
.includes(keyword)

);

});

renderAnime(filtered);

});


loadAnime();

</script>

</body>

</html>
