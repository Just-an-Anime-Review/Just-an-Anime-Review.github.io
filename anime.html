<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
background: #f7f7f7;

}

header {
background: #111;
color: white;
}

.header-inner {
max-width: 1100px;
margin: auto;
padding: 20px;
}

.logo {
color: white;
text-decoration: none;
font-weight: bold;
font-size: 21px;
}

main {
max-width: 1100px;
margin: auto;
padding: 45px 20px;
}

.page-header h1 {
font-size: 36px;
}

.page-header p {
color: #666;
}


/* =========================
   広告
========================= */

.ad-section {
display: none;
margin: 25px 0 30px;
}

.ad-label {
text-align: center;
font-size: 11px;
color: #999;
margin-bottom: 8px;
}

.ad-box {
background: white;
border: 1px solid #e5e5e5;
border-radius: 12px;
padding: 18px;
text-align: center;
box-shadow:
0 2px 10px rgba(0,0,0,.04);
}

.ad-box img {
display: block;
max-width: 100%;
max-height: 160px;
margin: 0 auto 12px;
border-radius: 8px;
}

.ad-company {
font-size: 12px;
color: #888;
margin-bottom: 5px;
}

.ad-title {
font-size: 17px;
font-weight: bold;
margin-bottom: 7px;
}

.ad-description {
color: #666;
font-size: 14px;
line-height: 1.7;
}

.ad-button {
display: inline-block;
margin-top: 10px;
padding: 8px 16px;
background: #111;
color: white;
text-decoration: none;
border-radius: 6px;
font-size: 13px;
}


/* =========================
   検索
========================= */

.search-box {
margin: 30px 0;
}

.search-box input {
width: 100%;
padding: 14px;
font-size: 16px;
border: 1px solid #ccc;
border-radius: 8px;
}

.search-box input:focus {
outline: none;
border-color: #555;
}

.search-help {
font-size: 13px;
color: #777;
margin-top: 8px;
}

.count {
margin-bottom: 20px;
color: #666;
}


/* =========================
   アニメ一覧
========================= */

#anime-list {
display: grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap: 22px;
}

.anime-card {
display: block;
background: white;
padding: 25px;
border-radius: 12px;
text-decoration: none;
color: #222;
box-shadow:
0 3px 15px rgba(0,0,0,.07);
transition: .2s;
}

.anime-card:hover {
transform: translateY(-4px);
}

.anime-card h2 {
margin-top: 0;
margin-bottom: 7px;
}

.english-title {
color: #777;
font-size: 14px;
margin-bottom: 14px;
}

.genre {
display: inline-block;
background: #eee;
padding: 5px 10px;
border-radius: 20px;
font-size: 13px;
}

.description {
color: #555;
line-height: 1.8;
}

.detail {
color: #06c;
font-weight: bold;
}

.status {
text-align: center;
padding: 40px;
color: #666;
}


/* =========================
   フッター
========================= */

footer {
margin-top: 70px;
background: #111;
color: white;
padding: 35px 20px;
}

.footer-inner {
max-width: 1100px;
margin: auto;
}


/* =========================
   管理画面
========================= */

.admin-link {
position: fixed;
right: 12px;
bottom: 10px;
font-size: 11px;
color: #999;
text-decoration: none;
opacity: .65;
z-index: 1000;
}

.admin-link:hover {
opacity: 1;
text-decoration: underline;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

main {
padding: 35px 15px;
}

.page-header h1 {
font-size: 30px;
}

#anime-list {
grid-template-columns: 1fr;
}

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<a
href="index.html"
class="logo">

Just An Anime Review

</a>

</div>

</header>


<main>


<section class="page-header">

<h1>
アニメ一覧
</h1>

<p>
登録されているアニメ作品をご覧いただけます。
</p>

</section>


<!-- =========================
     広告
========================= -->

<section
id="ad-section"
class="ad-section">

<div class="ad-label">
ADVERTISEMENT
</div>

<div
id="ad-container"
class="ad-box">

</div>

</section>


<!-- =========================
     検索
========================= -->

<div class="search-box">

<input
type="search"
id="search"
placeholder="作品名・英語名・ジャンルを検索"
autocomplete="off"
>

<div class="search-help">
日本語タイトル・英語タイトル・ジャンルから検索できます。
</div>

</div>


<div
id="count"
class="count">

読み込み中……

</div>


<div id="anime-list">

<div class="status">
アニメ情報を読み込んでいます……
</div>

</div>


</main>


<footer>

<div class="footer-inner">

<h2>
Just An Anime Review
</h2>

<p>
アニメをもっと深く、もっと面白く。
</p>

</div>

</footer>


<a
href="admin.html"
class="admin-link">

管理画面

</a>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   データ
========================= */

let animeData = [];


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================
   アニメ表示
========================= */

function renderAnime(list) {

const container =
document.getElementById("anime-list");

const count =
document.getElementById("count");

count.textContent =
`${list.length}作品`;

if (!list.length) {

container.innerHTML = `

<div class="status">

該当する作品がありません。

</div>

`;

return;

}

container.innerHTML = "";

list.forEach(anime => {

const card =
document.createElement("a");

card.className =
"anime-card";

card.href =
`anime-detail.html?id=${encodeURIComponent(anime.id)}`;

card.innerHTML = `

<h2>
${escapeHTML(anime.title)}
</h2>

${
anime.english_title
?
`
<div class="english-title">
${escapeHTML(anime.english_title)}
</div>
`
:
""
}

${
anime.genre
?
`
<div class="genre">
${escapeHTML(anime.genre)}
</div>
`
:
""
}

${
anime.description
?
`
<p class="description">
${escapeHTML(anime.description)}
</p>
`
:
""
}

<div class="detail">
詳細を見る →
</div>

`;

container.appendChild(card);

});

}


/* =========================
   アニメ取得
========================= */

async function loadAnime() {

const container =
document.getElementById("anime-list");

const { data, error } =
await supabaseClient
.from("anime")
.select(
"id,title,english_title,genre,description,review,official_url"
)
.order(
"id",
{ ascending: true }
);

if (error) {

console.error(
"アニメ取得エラー:",
error
);

container.innerHTML = `

<div class="status">

アニメ情報を取得できませんでした。

</div>

`;

return;

}

animeData =
data || [];

renderAnime(animeData);

}


/* =========================
   検索スコア
========================= */

function getSearchScore(
anime,
keyword
) {

const title =
(anime.title || "")
.toLowerCase();

const english =
(anime.english_title || "")
.toLowerCase();

const genre =
(anime.genre || "")
.toLowerCase();

const description =
(anime.description || "")
.toLowerCase();


/*
完全一致
*/

if (title === keyword)
return 1000;

if (english === keyword)
return 950;


/*
日本語タイトル先頭一致
*/

if (title.startsWith(keyword))
return 900;


/*
英語タイトル先頭一致
*/

if (english.startsWith(keyword))
return 850;


/*
ジャンル先頭一致
*/

if (genre.startsWith(keyword))
return 700;


/*
タイトル部分一致
*/

if (title.includes(keyword))
return 600;

if (english.includes(keyword))
return 550;


/*
ジャンル部分一致
*/

if (genre.includes(keyword))
return 400;


/*
説明文
*/

if (description.includes(keyword))
return 200;


return 0;

}


/* =========================
   検索
========================= */

document
.getElementById("search")
.addEventListener(
"input",
function() {

const keyword =
this.value
.trim()
.toLowerCase();


/*
検索欄が空の場合
*/

if (!keyword) {

renderAnime(
animeData
);

return;

}


/*
スコアをつけて並び替え
*/

const filtered =
animeData
.map(anime => {

return {

anime: anime,

score:
getSearchScore(
anime,
keyword
)

};

})
.filter(item =>
item.score > 0
)
.sort((a,b) => {

if (b.score !== a.score) {

return b.score - a.score;

}

/*
同じスコアならID順
*/

return (
Number(a.anime.id) -
Number(b.anime.id)
);

})
.map(item =>
item.anime
);


renderAnime(filtered);

});


/* =========================
   広告取得
========================= */

async function loadAdvertisement() {

const section =
document.getElementById("ad-section");

const container =
document.getElementById("ad-container");


const { data, error } =
await supabaseClient
.from("advertisements")
.select(
"id,company_name,title,description,image_url,link_url"
)
.eq(
"is_active",
true
)
.order(
"id",
{ ascending: true }
)
.limit(1);


if (error) {

console.error(
"広告取得エラー:",
error
);

section.style.display =
"none";

return;

}


if (!data || data.length === 0) {

section.style.display =
"none";

return;

}


const ad =
data[0];

let html = "";


/*
画像
*/

if (ad.image_url) {

html += `

<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(
ad.title || "広告"
)}"
onerror="this.style.display='none';"
>

`;

}


/*
企業名
*/

if (ad.company_name) {

html += `

<div class="ad-company">

${escapeHTML(
ad.company_name
)}

</div>

`;

}


/*
タイトル
*/

if (ad.title) {

html += `

<div class="ad-title">

${escapeHTML(
ad.title
)}

</div>

`;

}


/*
説明
*/

if (ad.description) {

html += `

<div class="ad-description">

${escapeHTML(
ad.description
)}

</div>

`;

}


/*
リンク
*/

if (ad.link_url) {

html += `

<a
class="ad-button"
href="${escapeHTML(
ad.link_url
)}"
target="_blank"
rel="noopener noreferrer">

詳しくはこちら

</a>

`;

}


container.innerHTML =
html;


/*
広告表示
*/

section.style.display =
"block";

}


/* =========================
   起動
========================= */

loadAnime();

loadAdvertisement();

</script>


</body>

</html>
