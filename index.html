<script>

/* =========================================================
   Supabase設定
========================================================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnU-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================================================
   URL安全性
========================================================= */

function isSafeURL(url) {

if (!url) {
return false;
}

try {

const parsed =
new URL(url);

return (
parsed.protocol === "http:" ||
parsed.protocol === "https:"
);

} catch {

return false;

}

}


/* =========================================================
   日付をYYYY-MM-DDとして取得
========================================================= */

function getTodayString() {

const now =
new Date();

const year =
now.getFullYear();

const month =
String(
now.getMonth() + 1
).padStart(2, "0");

const day =
String(
now.getDate()
).padStart(2, "0");

return `${year}-${month}-${day}`;

}


/* =========================================================
   時刻をHH:MMに変換
========================================================= */

function formatTime(time) {

if (!time) {
return "";
}

return String(time).slice(0, 5);

}


/* =========================================================
   日付表示
========================================================= */

function formatDate(date) {

if (!date) {
return "";
}

const parts =
String(date).split("-");

if (parts.length !== 3) {
return String(date);
}

return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;

}


/* =========================================================
   日付が期間内か判定
========================================================= */

function isDateInPeriod(
today,
startDate,
endDate
) {

/*
   開始日・終了日が
   どちらも未設定なら
   日付制限なし。
*/

if (
!startDate &&
!endDate
) {

return true;

}


/*
   開始日だけ指定
*/

if (
startDate &&
!endDate
) {

return today >= startDate;

}


/*
   終了日だけ指定
*/

if (
!startDate &&
endDate
) {

return today <= endDate;

}


/*
   開始日・終了日の両方
*/

return (
today >= startDate &&
today <= endDate
);

}


/* =========================================================
   時刻が期間内か判定
========================================================= */

function isTimeInPeriod(
currentTime,
startTime,
endTime
) {

if (
!startTime ||
!endTime
) {

return true;

}

const current =
currentTime
.split(":")
.map(Number);

const start =
formatTime(startTime)
.split(":")
.map(Number);

const end =
formatTime(endTime)
.split(":")
.map(Number);


const currentMinutes =
current[0] * 60 +
current[1];

const startMinutes =
start[0] * 60 +
start[1];

const endMinutes =
end[0] * 60 +
end[1];


/*
   例：
   10:00 ～ 20:00
*/

if (
startMinutes < endMinutes
) {

return (
currentMinutes >= startMinutes &&
currentMinutes < endMinutes
);

}


/*
   例：
   20:00 ～ 05:00
*/

if (
startMinutes > endMinutes
) {

return (
currentMinutes >= startMinutes ||
currentMinutes < endMinutes
);

}


/*
   同じ時刻の場合
   24時間扱いにはしない。
*/

return false;

}


/* =========================================================
   現在表示可能なおすすめを取得
========================================================= */

async function loadRecommendations() {

const container =
document.getElementById(
"recommendation-list"
);

const periodText =
document.getElementById(
"recommendation-period"
);


container.innerHTML = `
<div class="recommendation-empty">
おすすめアニメを読み込み中……
</div>
`;

periodText.textContent = "";


try {


/* =======================================================
   recommended_anime を取得
======================================================= */

const {
data: settings,
error: settingsError
} =
await supabaseClient
.from("recommended_anime")
.select(
"id,anime_id,start_date,end_date,start_time,end_time,display_order,is_active"
)
.eq(
"is_active",
true
)
.order(
"display_order",
{
ascending: true
}
);


if (settingsError) {

console.error(
"おすすめアニメ取得エラー:",
settingsError
);

container.innerHTML = `
<div class="recommendation-empty">
おすすめアニメを現在表示できません。
</div>
`;

return;

}


if (
!settings ||
settings.length === 0
) {

container.innerHTML = `
<div class="recommendation-empty">
現在、おすすめアニメは設定されていません。
</div>
`;

return;

}


/* =======================================================
   現在日時
======================================================= */

const now =
new Date();

const today =
getTodayString();

const currentTime =
String(
now.getHours()
).padStart(2, "0")
+
":" +
String(
now.getMinutes()
).padStart(2, "0");


/* =======================================================
   現在表示可能な設定だけ抽出
======================================================= */

const activeSettings =
settings.filter(
setting => {

const dateOK =
isDateInPeriod(
today,
setting.start_date,
setting.end_date
);

const timeOK =
isTimeInPeriod(
currentTime,
setting.start_time,
setting.end_time
);

return (
dateOK &&
timeOK
);

});


/*
   現在表示可能なおすすめが
   なければ終了。
*/

if (
activeSettings.length === 0
) {

container.innerHTML = `
<div class="recommendation-empty">
現在、おすすめアニメは設定されていません。
</div>
`;

return;

}


/* =======================================================
   アニメIDを取得
======================================================= */

const ids =
activeSettings
.map(
item =>
item.anime_id
)
.filter(
id =>
id !== null &&
id !== undefined
);


if (
ids.length === 0
) {

container.innerHTML = `
<div class="recommendation-empty">
現在、おすすめアニメは設定されていません。
</div>
`;

return;

}


/* =======================================================
   アニメ情報取得
======================================================= */

const {
data: animeData,
error: animeError
} =
await supabaseClient
.from("anime")
.select(
"id,title,english_title,genre,description"
)
.in(
"id",
ids
);


if (animeError) {

console.error(
"おすすめ作品取得エラー:",
animeError
);

container.innerHTML = `
<div class="recommendation-empty">
おすすめアニメを表示できません。
</div>
`;

return;

}


/* =======================================================
   アニメをIDで管理
======================================================= */

const animeMap =
new Map(
(animeData || [])
.map(
anime =>
[
String(anime.id),
anime
]
)
);


/* =======================================================
   表示順に並べる
======================================================= */

const orderedSettings =
activeSettings
.slice()
.sort(
(a, b) => {

const orderA =
Number(
a.display_order
) || 0;

const orderB =
Number(
b.display_order
) || 0;

return (
orderA - orderB
);

}
);


/* =======================================================
   カード作成
======================================================= */

container.innerHTML = "";


orderedSettings.forEach(
(setting, index) => {

const anime =
animeMap.get(
String(
setting.anime_id
)
);


if (!anime) {
return;
}


const card =
document.createElement(
"article"
);

card.className =
"recommendation-card";


const link =
document.createElement(
"a"
);

link.href =
"anime-detail.html?id=" +
encodeURIComponent(
anime.id
);

link.style.textDecoration =
"none";


const number =
document.createElement(
"div"
);

number.className =
"recommendation-number";

number.textContent =
`RECOMMENDATION ${index + 1}`;

link.appendChild(
number
);


const title =
document.createElement(
"h3"
);

title.textContent =
anime.title || "";

link.appendChild(
title
);


if (
anime.english_title
) {

const english =
document.createElement(
"div"
);

english.className =
"recommendation-english";

english.textContent =
anime.english_title;

link.appendChild(
english
);

}


if (
anime.genre
) {

const genre =
document.createElement(
"div"
);

genre.className =
"recommendation-genre";

genre.textContent =
anime.genre;

link.appendChild(
genre
);

}


if (
anime.description
) {

const description =
document.createElement(
"div"
);

description.className =
"recommendation-description";

description.textContent =
anime.description;

link.appendChild(
description
);

}


card.appendChild(
link
);

container.appendChild(
card
);

});


/* =======================================================
   表示期間を表示
======================================================= */

const first =
orderedSettings[0];


if (first) {

let dateText = "";

if (
first.start_date &&
first.end_date
) {

dateText =
`${formatDate(first.start_date)} ～ ${formatDate(first.end_date)}`;

} else if (
first.start_date
) {

dateText =
`${formatDate(first.start_date)} ～`;

} else if (
first.end_date
) {

dateText =
`～ ${formatDate(first.end_date)}`;

}


const start =
formatTime(
first.start_time
);

const end =
formatTime(
first.end_time
);


if (
dateText &&
start &&
end
) {

periodText.textContent =
`${dateText} ${start}～${end}`;

} else if (
dateText
) {

periodText.textContent =
dateText;

} else if (
start &&
end
) {

periodText.textContent =
`${start}～${end}`;

}

}


} catch (error) {

console.error(
"おすすめアニメ読み込みエラー:",
error
);

container.innerHTML = `
<div class="recommendation-empty">
現在、おすすめアニメを表示できません。
</div>
`;

}

}


/* =========================================================
   広告取得
========================================================= */

async function loadAdvertisement() {

const section =
document.getElementById(
"ad-section"
);

const container =
document.getElementById(
"ad-container"
);


try {

const {
data,
error
} =
await supabaseClient
.from("advertisements")
.select(
"id,company_name,title,description,image_url,link_url"
)
.eq(
"is_active",
true
)
.order(
"id",
{
ascending: true
}
)
.limit(1);


if (error) {

console.error(
"広告の取得に失敗しました:",
error
);

return;

}


if (
!data ||
data.length === 0
) {

return;

}


const ad =
data[0];

let html = "";


/* =======================================================
   広告画像
======================================================= */

if (
ad.image_url &&
isSafeURL(
ad.image_url
)
) {

html += `

<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(
ad.title || "広告"
)}"
loading="lazy"
onerror="this.style.display='none';"
>

`;

}


/* =======================================================
   企業名
======================================================= */

if (
ad.company_name
) {

html += `

<div class="ad-company">
${escapeHTML(
ad.company_name
)}
</div>

`;

}


/* =======================================================
   タイトル
======================================================= */

if (
ad.title
) {

html += `

<div class="ad-title">
${escapeHTML(
ad.title
)}
</div>

`;

}


/* =======================================================
   説明
======================================================= */

if (
ad.description
) {

html += `

<div class="ad-description">
${escapeHTML(
ad.description
)}
</div>

`;

}


/* =======================================================
   リンク
======================================================= */

if (
ad.link_url &&
isSafeURL(
ad.link_url
)
) {

html += `

<a
class="ad-button"
href="${escapeHTML(
ad.link_url
)}"
target="_blank"
rel="noopener noreferrer nofollow">

詳しくはこちら
