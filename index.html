<script>

/* =========================================================
   Supabase設定
========================================================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnU-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================================================
   URL安全性
========================================================= */

function isSafeURL(url) {

if (!url) {
return false;
}

try {

const parsed =
new URL(url);

return (
parsed.protocol === "http:" ||
parsed.protocol === "https:"
);

} catch {

return false;

}

}


/* =========================================================
   アニメ取得
========================================================= */

async function loadAnime() {

const container =
document.getElementById(
"anime-list"
);

const {
data,
error
} =
await supabaseClient
.from("anime")
.select(
"id,title,english_title,genre,description"
)
.order(
"id",
{
ascending: true
}
);

if (error) {

console.error(error);

container.innerHTML = `

<div class="empty">
アニメ情報の取得に失敗しました。
</div>

`;

return;

}


if (
!data ||
data.length === 0
) {

container.innerHTML = `

<div class="empty">
登録されているアニメはありません。
</div>

`;

return;

}


container.innerHTML = "";


data.forEach(
anime => {

const card =
document.createElement(
"article"
);

card.className =
"anime-card";


const link =
document.createElement(
"a"
);

link.href =
"anime-detail.html?id=" +
encodeURIComponent(
anime.id
);


const title =
document.createElement(
"h3"
);

title.className =
"anime-title";

title.textContent =
anime.title || "";

link.appendChild(
title
);


if (
anime.english_title
) {

const english =
document.createElement(
"div"
);

english.className =
"anime-english";

english.textContent =
anime.english_title;

link.appendChild(
english
);

}


if (
anime.genre
) {

const genre =
document.createElement(
"div"
);

genre.className =
"anime-genre";

genre.textContent =
anime.genre;

link.appendChild(
genre
);

}


if (
anime.description
) {

const description =
document.createElement(
"div"
);

description.className =
"anime-description";

description.textContent =
anime.description;

link.appendChild(
description
);

}


card.appendChild(
link
);

container.appendChild(
card
);

});

}


/* =========================================================
   現在の時間帯を判定
========================================================= */

function isHourInPeriod(
hour,
startHour,
endHour
) {

if (
startHour < endHour
) {

return (
hour >= startHour &&
hour < endHour
);

}

return (
hour >= startHour ||
hour < endHour
);

}


/* =========================================================
   おすすめアニメ取得
========================================================= */

async function loadRecommendations() {

const container =
document.getElementById(
"recommendation-list"
);

const periodText =
document.getElementById(
"recommendation-period"
);


const {
data: settings,
error: settingsError
} =
await supabaseClient
.from("recommendation_settings")
.select(
"id,period_name,start_hour,end_hour,anime_id_1,anime_id_2,anime_id_3"
)
.order(
"id",
{
ascending: true
}
);


if (settingsError) {

console.error(
"おすすめ設定取得エラー:",
settingsError
);

container.innerHTML = `

<div class="recommendation-empty">
おすすめアニメの取得に失敗しました。
</div>

`;

return;

}


if (
!settings ||
settings.length === 0
) {

container.innerHTML = `

<div class="recommendation-empty">
現在、おすすめアニメは設定されていません。
</div>

`;

return;

}


const now =
new Date();

const currentHour =
now.getHours();


let currentPeriod =
settings.find(
setting =>
isHourInPeriod(
currentHour,
Number(setting.start_hour),
Number(setting.end_hour)
)
);


if (!currentPeriod) {

currentPeriod =
settings[0];

}


periodText.textContent =
currentPeriod.period_name;


const ids = [

currentPeriod.anime_id_1,
currentPeriod.anime_id_2,
currentPeriod.anime_id_3

]
.filter(
id =>
id !== null &&
id !== undefined
);


if (!ids.length) {

container.innerHTML = `

<div class="recommendation-empty">
現在、この時間帯のおすすめアニメは設定されていません。
</div>

`;

return;

}


const {
data: animeData,
error: animeError
} =
await supabaseClient
.from("anime")
.select(
"id,title,english_title,genre,description"
)
.in(
"id",
ids
);


if (animeError) {

console.error(
"おすすめアニメ取得エラー:",
animeError
);

container.innerHTML = `

<div class="recommendation-empty">
おすすめアニメの取得に失敗しました。
</div>

`;

return;

}


const animeMap =
new Map(
(animeData || [])
.map(
anime =>
[
String(anime.id),
anime
]
)
);


const orderedAnime =
ids
.map(
id =>
animeMap.get(
String(id)
)
)
.filter(Boolean);


container.innerHTML = "";


orderedAnime.forEach(
(anime, index) => {

const card =
document.createElement(
"article"
);

card.className =
"recommendation-card";


const link =
document.createElement(
"a"
);

link.href =
"anime-detail.html?id=" +
encodeURIComponent(
anime.id
);

link.style.textDecoration =
"none";


const number =
document.createElement(
"div"
);

number.className =
"recommendation-number";

number.textContent =
`RECOMMENDATION ${index + 1}`;

link.appendChild(
number
);


const title =
document.createElement(
"h3"
);

title.textContent =
anime.title || "";

link.appendChild(
title
);


if (
anime.english_title
) {

const english =
document.createElement(
"div"
);

english.className =
"recommendation-english";

english.textContent =
anime.english_title;

link.appendChild(
english
);

}


if (
anime.genre
) {

const genre =
document.createElement(
"div"
);

genre.className =
"recommendation-genre";

genre.textContent =
anime.genre;

link.appendChild(
genre
);

}


if (
anime.description
) {

const description =
document.createElement(
"div"
);

description.className =
"recommendation-description";

description.textContent =
anime.description;

link.appendChild(
description
);

}


card.appendChild(
link
);

container.appendChild(
card
);

});

}


/* =========================================================
   広告取得
========================================================= */

async function loadAdvertisement() {

const section =
document.getElementById(
"ad-section"
);

const container =
document.getElementById(
"ad-container"
);


try {

const {
data,
error
} =
await supabaseClient
.from("advertisements")
.select(
"id,company_name,title,description,image_url,link_url"
)
.eq(
"is_active",
true
)
.order(
"id",
{
ascending: true
}
)
.limit(1);


if (error) {

console.error(
"広告の取得に失敗しました:",
error
);

return;

}


if (
!data ||
data.length === 0
) {

return;

}


const ad =
data[0];

let html = "";


if (
ad.image_url &&
isSafeURL(
ad.image_url
)
) {

html += `

<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(ad.title || "広告")}"
loading="lazy"
onerror="this.style.display='none';"
>

`;

}


if (
ad.company_name
) {

html += `

<div class="ad-company">
${escapeHTML(ad.company_name)}
</div>

`;

}


if (
ad.title
) {

html += `

<div class="ad-title">
${escapeHTML(ad.title)}
</div>

`;

}


if (
ad.description
) {

html += `

<div class="ad-description">
${escapeHTML(ad.description)}
</div>

`;

}


if (
ad.link_url &&
isSafeURL(
ad.link_url
)
) {

html += `

<a
class="ad-button"
href="${escapeHTML(ad.link_url)}"
target="_blank"
rel="noopener noreferrer nofollow">

詳しくはこちら

</a>

`;

}


if (
!html.trim()
) {

return;

}


container.innerHTML =
html;

section.style.display =
"block";


} catch (error) {

console.error(
"広告読み込み中にエラーが発生しました:",
error
);

}

}


/* =========================================================
   起動
========================================================= */

document.addEventListener(
"DOMContentLoaded",
() => {

loadRecommendations();

loadAnime();

loadAdvertisement();

}
);

</script>
