<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================
   広告読み込み
========================= */

async function loadAdvertisement() {

const section =
document.getElementById("ad-section");

const container =
document.getElementById("ad-container");


const { data, error } =
await supabaseClient
.from("advertisements")
.select(
"id,company_name,title,description,image_url,link_url"
)
.eq(
"is_active",
true
)
.order(
"id",
{ ascending: true }
)
.limit(1);


if (error) {

console.error(
"広告の取得に失敗しました:",
error
);

return;

}


/* 広告がない場合は何も表示しない */

if (!data || data.length === 0) {

section.style.display =
"none";

return;

}


const ad =
data[0];


let html = "";


if (ad.image_url) {

html += `

<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(ad.title || "広告")}"
onerror="this.style.display='none';"
>

`;

}


if (ad.company_name) {

html += `

<div class="ad-company">
${escapeHTML(ad.company_name)}
</div>

`;

}


if (ad.title) {

html += `

<div class="ad-title">
${escapeHTML(ad.title)}
</div>

`;

}


if (ad.description) {

html += `

<div class="ad-description">
${escapeHTML(ad.description)}
</div>

`;

}


if (ad.link_url) {

html += `

<a
class="ad-button"
href="${escapeHTML(ad.link_url)}"
target="_blank"
rel="noopener noreferrer">

詳しくはこちら

</a>

`;

}


container.innerHTML =
html;


/* 広告が存在するときだけ表示 */

section.style.display =
"block";

}


/* =========================
   起動
========================= */

loadAdvertisement();

</script>


</body>
