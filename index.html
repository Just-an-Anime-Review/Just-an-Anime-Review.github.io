<script>

/* =========================
   Supabase設定
========================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnU-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================
   URL安全性
========================= */

function isSafeURL(url) {

if (!url) {
return false;
}

try {

const parsed =
new URL(url);

return (
parsed.protocol === "http:" ||
parsed.protocol === "https:"
);

} catch {

return false;

}

}


/* =========================
   時刻を分に変換
========================= */

function timeToMinutes(time) {

const parts =
String(time)
.slice(0,5)
.split(":");

return (
Number(parts[0]) * 60 +
Number(parts[1])
);

}


/* =========================
   現在時刻が時間帯内か
========================= */

function isTimeInSchedule(
currentMinutes,
startTime,
endTime
) {

const start =
timeToMinutes(startTime);

const end =
timeToMinutes(endTime);


/*
  通常の時間帯
  例：08:00 → 18:00
*/

if (start < end) {

return (
currentMinutes >= start &&
currentMinutes < end
);

}


/*
  日付をまたぐ時間帯
  例：22:00 → 02:00
*/

if (start > end) {

return (
currentMinutes >= start ||
currentMinutes < end
);

}


/*
  start == end の場合は
  24時間表示として扱う
*/

return true;

}


/* =========================
   アニメカード作成
========================= */

function createAnimeCard(anime) {

const card =
document.createElement("article");

card.className =
"anime-card";


const link =
document.createElement("a");

link.href =
"anime-detail.html?id=" +
encodeURIComponent(
anime.id
);


const title =
document.createElement("h3");

title.className =
"anime-title";

title.textContent =
anime.title || "";

link.appendChild(
title
);


if (
anime.english_title
) {

const english =
document.createElement("div");

english.className =
"anime-english";

english.textContent =
anime.english_title;

link.appendChild(
english
);

}


if (
anime.genre
) {

const genre =
document.createElement("div");

genre.className =
"anime-genre";

genre.textContent =
anime.genre;

link.appendChild(
genre
);

}


if (
anime.description
) {

const description =
document.createElement("div");

description.className =
"anime-description";

description.textContent =
anime.description;

link.appendChild(
description
);

}


card.appendChild(
link
);

return card;

}


/* =========================
   通常アニメ一覧
========================= */

async function loadAnime() {

const container =
document.getElementById(
"anime-list"
);

const {
data,
error
} =
await supabaseClient
.from("anime")
.select(
"id,title,english_title,genre,description"
)
.order(
"id",
{
ascending: true
}
);

if (error) {

console.error(error);

container.innerHTML = `
<div class="empty">
アニメ情報の取得に失敗しました。
</div>
`;

return;

}

if (
!data ||
data.length === 0
) {

container.innerHTML = `
<div class="empty">
登録されているアニメはありません。
</div>
`;

return;

}

container.innerHTML = "";

data.forEach(
anime => {

container.appendChild(
createAnimeCard(anime)
);

});

}


/* =========================
   時間帯別おすすめ
========================= */

async function loadRecommendations() {

const container =
document.getElementById(
"anime-list"
);

const title =
document.getElementById(
"recommendation-title"
);


/* 現在時刻 */

const now =
new Date();

const currentMinutes =
now.getHours() * 60 +
now.getMinutes();


/* 時間帯取得 */

const {
data: schedules,
error:
scheduleError
} =
await supabaseClient
.from(
"anime_recommendation_schedules"
)
.select(
"id,name,start_time,end_time,is_active"
)
.eq(
"is_active",
true
);


if (scheduleError) {

console.error(
"おすすめ時間帯取得エラー:",
scheduleError
);

await loadAnime();

return;

}


/* 現在の時間帯を探す */

const schedule =
(schedules || []).find(
item =>
isTimeInSchedule(
currentMinutes,
item.start_time,
item.end_time
)
);


if (!schedule) {

title.textContent =
"おすすめアニメ";

await loadAnime();

return;

}


/* おすすめ作品取得 */

const {
data: items,
error:
itemError
} =
await supabaseClient
.from(
"anime_recommendation_items"
)
.select(`
id,
anime_id,
display_order,
anime:anime_id(
id,
title,
english_title,
genre,
description
)
`)
.eq(
"schedule_id",
schedule.id
)
.order(
"display_order",
{
ascending: true
}
);


if (itemError) {

console.error(
"おすすめアニメ取得エラー:",
itemError
);

await loadAnime();

return;

}


/* データがない場合 */

if (
!items ||
items.length === 0
) {

title.textContent =
schedule.name ||
"おすすめアニメ";

container.innerHTML = `
<div class="empty">
現在おすすめのアニメは設定されていません。
</div>
`;

return;

}


/* タイトル */

title.textContent =
schedule.name ||
"おすすめアニメ";


/* 表示 */

container.innerHTML = "";

items.forEach(
item => {

if (!item.anime) {
return;
}

container.appendChild(
createAnimeCard(
item.anime
)
);

});

}


/* =========================
   広告取得
========================= */

async function loadAdvertisement() {

const section =
document.getElementById(
"ad-section"
);

const container =
document.getElementById(
"ad-container"
);

try {

const {
data,
error
} =
await supabaseClient
.from("advertisements")
.select(
"id,company_name,title,description,image_url,link_url"
)
.eq(
"is_active",
true
)
.order(
"id",
{
ascending: true
}
)
.limit(1);


if (error) {

console.error(
"広告の取得に失敗しました:",
error
);

return;

}


if (
!data ||
data.length === 0
) {

return;

}


const ad =
data[0];

let html = "";


if (
ad.image_url &&
isSafeURL(
ad.image_url
)
) {

html += `
<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(ad.title || "広告")}"
loading="lazy"
onerror="this.style.display='none';"
>
`;

}


if (
ad.company_name
) {

html += `
<div class="ad-company">
${escapeHTML(ad.company_name)}
</div>
`;

}


if (
ad.title
) {

html += `
<div class="ad-title">
${escapeHTML(ad.title)}
</div>
`;

}


if (
ad.description
) {

html += `
<div class="ad-description">
${escapeHTML(ad.description)}
</div>
`;

}


if (
ad.link_url &&
isSafeURL(
ad.link_url
)
) {

html += `
<a
class="ad-button"
href="${escapeHTML(ad.link_url)}"
target="_blank"
rel="noopener noreferrer nofollow">

詳しくはこちら

</a>
`;

}


if (
!html.trim()
) {

return;

}


container.innerHTML =
html;

section.style.display =
"block";

} catch (error) {

console.error(
"広告読み込み中にエラーが発生しました:",
error
);

}

}


/* =========================
   起動
========================= */

document.addEventListener(
"DOMContentLoaded",
() => {

loadRecommendations();

loadAdvertisement();

}
);

</script>
