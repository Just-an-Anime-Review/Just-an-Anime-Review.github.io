name: Generate Sitemap

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap
        env:
          SUPABASE_URL: https://bhgdjuwlxvbaeraaivmh.supabase.co
          SUPABASE_KEY: sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c
        run: |

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          BASE_URL = "https://just-an-anime-review.github.io"

          headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}"
          }

          url = (
              SUPABASE_URL
              + "/rest/v1/anime"
              + "?select=id"
              + "&order=id.asc"
          )

          request = urllib.request.Request(
              url,
              headers=headers
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          urls = []

          # トップページ
          urls.append(
              f"{BASE_URL}/"
          )

          # アニメ一覧
          urls.append(
              f"{BASE_URL}/anime.html"
          )

          # アニメ詳細ページ
          for anime in data:
              anime_id = anime.get("id")

              if anime_id is None:
                  continue

              urls.append(
                  f"{BASE_URL}/anime-detail.html?id={anime_id}"
              )

          # sitemap.xml
          urlset = ET.Element(
              "urlset",
              {
                  "xmlns":
                  "http://www.sitemaps.org/schemas/sitemap/0.9"
              }
          )

          for page_url in urls:

              url_element = ET.SubElement(
                  urlset,
                  "url"
              )

              loc = ET.SubElement(
                  url_element,
                  "loc"
              )

              loc.text = page_url

          tree = ET.ElementTree(urlset)

          ET.indent(
              tree,
              space="  "
          )

          tree.write(
              "sitemap.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print(
              f"Sitemap generated: {len(urls)} URLs"
          )

          PY

      - name: Commit sitemap
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to sitemap.xml"
            exit 0
          fi

          git commit -m "Update sitemap"
          git push
