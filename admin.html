<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>管理者ログイン | Just An Anime Review</title>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
background: #f7f7f7;
}

header {
background: #111;
color: white;
}

.header-inner {
max-width: 800px;
margin: auto;
padding: 20px;
}

.logo {
color: white;
text-decoration: none;
font-weight: bold;
}

main {
max-width: 500px;
margin: 70px auto;
padding: 20px;
}

.box {
background: white;
padding: 35px;
border-radius: 12px;
box-shadow:
0 3px 15px rgba(0,0,0,.08);
}

h1 {
margin-top: 0;
}

label {
display: block;
margin: 20px 0 7px;
font-weight: bold;
}

input {
width: 100%;
padding: 12px;
border: 1px solid #ccc;
border-radius: 7px;
font-size: 16px;
}

button {
width: 100%;
margin-top: 25px;
padding: 12px;
border: none;
border-radius: 7px;
background: #111;
color: white;
cursor: pointer;
font-size: 16px;
}

button:hover {
opacity: .8;
}

#message {
text-align: center;
margin-top: 20px;
}

.back {
display: block;
margin-top: 25px;
text-align: center;
color: #666;
}

</style>

</head>

<body>

<header>

<div class="header-inner">

<a href="index.html"
class="logo">

Just An Anime Review

</a>

</div>

</header>


<main>

<div class="box">

<h1>
管理者ログイン
</h1>

<p>
管理者のみ利用できます。
</p>


<form id="login-form">

<label>
メールアドレス
</label>

<input
type="email"
id="email"
required
>


<label>
パスワード
</label>

<input
type="password"
id="password"
required
>


<button type="submit">
ログイン
</button>

</form>


<p id="message"></p>


<a href="index.html"
class="back">

← ホームへ戻る

</a>

</div>

</main>


<script>

const SUPABASE_URL =
"ここにProject URL";

const SUPABASE_KEY =
"ここにPublishable key";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


document
.getElementById("login-form")
.addEventListener(
"submit",
async function(e) {

e.preventDefault();


const email =
document.getElementById("email")
.value;


const password =
document.getElementById("password")
.value;


const message =
document.getElementById("message");


message.textContent =
"ログインしています……";


const { error } =
await supabaseClient.auth
.signInWithPassword({

email,
password

});


if (error) {

message.textContent =
"ログインに失敗しました。";

console.error(error);

return;

}


location.href =
"admin-dashboard.html";

});

</script>

</body>

</html>
