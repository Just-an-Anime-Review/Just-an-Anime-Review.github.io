<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>管理画面 | Just An Anime Review</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="logo">
            Just An Anime Review
        </a>

    </div>

</header>


<main>


    <section class="page-header">

        <p class="section-label">
            ADMIN
        </p>

        <h1>
            管理画面
        </h1>

        <p>
            Just An Anime Review 管理者ページ
        </p>

    </section>


    <section class="section">


        <div class="anime-detail">


            <h2>
                管理者ログイン
            </h2>


            <form id="login-form">


                <p>
                    <label for="email">
                        メールアドレス
                    </label>
                </p>


                <input
                    type="email"
                    id="email"
                    placeholder="メールアドレス"
                    required
                >


                <p>
                    <label for="password">
                        パスワード
                    </label>
                </p>


                <input
                    type="password"
                    id="password"
                    placeholder="パスワード"
                    required
                >


                <br><br>


                <button type="submit">
                    ログイン
                </button>


            </form>


            <p id="message"></p>


        </div>


    </section>


</main>


<footer>

    <div class="footer-inner">

        <h2>
            Just An Anime Review
        </h2>

        <p>
            アニメをもっと深く、もっと面白く。
        </p>

        <p class="copyright">
            © 2026 Just An Anime Review
        </p>

    </div>

</footer>



<script>


/* =========================================
   Supabase設定
========================================= */


/*
   ↓↓↓ ここを自分のSupabase情報に変更します ↓↓↓
*/


const SUPABASE_URL =
    "ここにProject URLを入れる";


const SUPABASE_KEY =
    "ここにPublishable keyを入れる";


/*
   ↑↑↑ ここまで ↑↑↑
*/


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   ログイン処理
========================================= */


const loginForm =
    document.getElementById("login-form");


const message =
    document.getElementById("message");



loginForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const email =
            document.getElementById("email").value;


        const password =
            document.getElementById("password").value;



        message.textContent =
            "ログインしています……";



        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });



        if (error) {


            message.textContent =
                "ログインに失敗しました。メールアドレスとパスワードを確認してください。";


            return;

        }



        message.textContent =
            "ログインしました。";


        /*
           ログイン成功後に
           管理画面へ移動
        */


        window.location.href =
            "admin-dashboard.html";


    }
);


</script>


</body>

</html>
