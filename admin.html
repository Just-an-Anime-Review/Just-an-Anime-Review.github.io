<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>管理者ログイン | Just An Anime Review</title>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
background: #f7f7f7;
color: #222;
}

header {
background: #111;
color: white;
}

.header-inner {
max-width: 800px;
margin: auto;
padding: 18px 20px;
}

.logo {
color: white;
text-decoration: none;
font-weight: bold;
font-size: 16px;
}

main {
max-width: 500px;
margin: 70px auto;
padding: 20px;
}

.box {
background: white;
padding: 35px;
border-radius: 12px;
box-shadow:
0 3px 15px rgba(0,0,0,.08);
}

h1 {
margin-top: 0;
margin-bottom: 10px;
}

.description {
color: #666;
line-height: 1.7;
font-size: 14px;
}

label {
display: block;
margin: 20px 0 7px;
font-weight: bold;
}

input {
width: 100%;
padding: 12px;
border: 1px solid #ccc;
border-radius: 7px;
font-size: 16px;
font-family: inherit;
}

input:focus {
outline: none;
border-color: #555;
}

button {
width: 100%;
margin-top: 25px;
padding: 12px;
border: none;
border-radius: 7px;
background: #111;
color: white;
cursor: pointer;
font-size: 16px;
}

button:hover {
opacity: .8;
}

button:disabled {
opacity: .5;
cursor: not-allowed;
}

#message {
text-align: center;
margin-top: 20px;
min-height: 20px;
font-size: 14px;
}

.back {
display: block;
margin-top: 25px;
text-align: center;
color: #666;
text-decoration: none;
font-size: 14px;
}

.back:hover {
text-decoration: underline;
}

</style>

</head>


<body>


<header>

<div class="header-inner">

<a
href="index.html"
class="logo">

Just An Anime Review

</a>

</div>

</header>


<main>

<div class="box">

<h1>
管理者ログイン
</h1>

<p class="description">
管理者のみ利用できます。
</p>


<form id="login-form">


<label for="email">
メールアドレス
</label>

<input
type="email"
id="email"
autocomplete="email"
required
>


<label for="password">
パスワード
</label>

<input
type="password"
id="password"
autocomplete="current-password"
required
>


<button
type="submit"
id="login-button">

ログイン

</button>


</form>


<p id="message"></p>


<a
href="index.html"
class="back">

← ホームへ戻る

</a>

</div>

</main>


<script>

/* =========================================
   Supabase設定
========================================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   ログイン済みか確認
========================================= */

async function checkExistingSession() {

const { data, error } =
await supabaseClient.auth.getSession();


if (error) {

console.error(error);

return;

}


if (data.session) {

location.href =
"admin-dashboard.html";

}

}


/* =========================================
   ログイン
========================================= */

document
.getElementById("login-form")
.addEventListener(
"submit",
async function(e) {

e.preventDefault();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


const message =
document
.getElementById("message");


const button =
document
.getElementById("login-button");


message.textContent =
"ログインしています……";


button.disabled =
true;


const { error } =
await supabaseClient.auth
.signInWithPassword({

email:
email,

password:
password

});


if (error) {

console.error(error);

message.textContent =
"メールアドレスまたはパスワードが正しくありません。";

button.disabled =
false;

return;

}


/* ログイン成功 */

message.textContent =
"ログインしました。";


location.href =
"admin-dashboard.html";

});


/* =========================================
   起動
========================================= */

checkExistingSession();

</script>


</body>

</html>
