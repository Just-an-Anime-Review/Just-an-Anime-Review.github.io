<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>管理画面 | Just An Anime Review</title>


    <link rel="stylesheet" href="style.css">


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <style>

        body {
            background: #f7f7f7;
        }


        .admin-container {
            max-width: 600px;

            margin: 70px auto;

            padding: 0 20px;
        }


        .login-box {
            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);
        }


        .login-box h1 {
            margin-top: 0;

            font-size: 30px;
        }


        .login-box p {
            color: #666;

            line-height: 1.7;
        }


        label {
            display: block;

            margin-top: 20px;

            margin-bottom: 8px;

            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;
        }


        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #111;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {
            opacity: 0.8;
        }


        #message {
            margin-top: 20px;

            text-align: center;
        }


        .back-link {
            display: block;

            margin-top: 25px;

            text-align: center;

            color: #666;

            text-decoration: none;
        }

    </style>

</head>


<body>


<header class="site-header">

    <div class="header-inner">

        <a
            href="index.html"
            class="logo"
        >
            Just An Anime Review
        </a>

    </div>

</header>



<main>

    <div class="admin-container">

        <div class="login-box">


            <h1>
                管理画面
            </h1>


            <p>
                管理者のみログインできます。
            </p>


            <form id="login-form">


                <label for="email">
                    メールアドレス
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="メールアドレス"
                    required
                >



                <label for="password">
                    パスワード
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="パスワード"
                    required
                >



                <button type="submit">
                    ログイン
                </button>


            </form>


            <p id="message"></p>


            <a
                href="index.html"
                class="back-link"
            >
                ← ホームに戻る
            </a>


        </div>

    </div>

</main>



<script>


/* =========================================
   Supabase設定
========================================= */


const SUPABASE_URL =
    "https://bhgdjuwlxvbaeraaivmh.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   ログイン
========================================= */


const loginForm =
    document.getElementById("login-form");


const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const email =
            document.getElementById("email").value;


        const password =
            document.getElementById("password").value;


        message.textContent =
            "ログインしています……";


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            console.error(error);


            message.textContent =
                "ログインに失敗しました。";


            return;

        }


        message.textContent =
            "ログインしました。";


        window.location.href =
            "admin-dashboard.html";


    }
);


</script>


</body>

</html>
