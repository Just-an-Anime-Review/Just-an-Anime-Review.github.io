<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>管理画面 | Just An Anime Review</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="logo">
            Just An Anime Review
        </a>

    </div>

</header>


<main>

    <section class="page-header">

        <p class="section-label">ADMIN</p>

        <h1>管理画面</h1>

        <p>
            Just An Anime Review 管理者ページ
        </p>

    </section>


    <section class="section">

        <div class="anime-detail">

            <h2>ログイン</h2>

            <form id="login-form">

                <p>
                    <label for="email">メールアドレス</label>
                </p>

                <input
                    type="email"
                    id="email"
                    required
                >

                <p>
                    <label for="password">パスワード</label>
                </p>

                <input
                    type="password"
                    id="password"
                    required
                >

                <br><br>

                <button type="submit">
                    ログイン
                </button>

            </form>

            <p id="message"></p>

        </div>

    </section>

</main>


<footer>

    <div class="footer-inner">

        <h2>Just An Anime Review</h2>

        <p>
            アニメをもっと深く、もっと面白く。
        </p>

        <p class="copyright">
            © 2026 Just An Anime Review
        </p>

    </div>

</footer>

</body>

</html>
