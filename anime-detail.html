<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>アニメ詳細 | Just An Anime Review</title>

    <meta name="description"
          content="Just An Anime Reviewのアニメ作品詳細ページ。">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f7f7f7;

            color: #222;
        }

        header {
            background: #111;

            color: white;
        }

        .header-inner {
            max-width: 1000px;

            margin: 0 auto;

            padding: 20px;
        }

        .logo {
            color: white;

            text-decoration: none;

            font-size: 22px;

            font-weight: bold;
        }

        main {
            max-width: 900px;

            margin: 0 auto;

            padding: 50px 20px;
        }

        .anime-detail {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;

            margin-bottom: 15px;

            font-size: 40px;
        }

        .genre {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: #eee;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .content-section {
            margin-top: 35px;
        }

        .content-section h2 {
            border-bottom: 2px solid #eee;

            padding-bottom: 10px;

            margin-bottom: 15px;
        }

        .content-section p {
            line-height: 2;

            white-space: pre-wrap;

            color: #444;
        }

        .official-link {
            display: inline-block;

            margin-top: 25px;

            color: #06c;

            text-decoration: none;

            font-weight: bold;
        }

        .official-link:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;

            margin-top: 35px;

            color: #555;

            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #loading {
            text-align: center;

            padding: 50px;

            color: #666;
        }

        #error {
            display: none;

            text-align: center;

            padding: 50px;
        }

        footer {
            margin-top: 80px;

            background: #111;

            color: white;

            padding: 40px 20px;
        }

        .footer-inner {
            max-width: 1000px;

            margin: 0 auto;
        }

        .copyright {
            color: #aaa;

            font-size: 14px;

            margin-top: 25px;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 30px;
            }

            .anime-detail {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <a
            href="index.html"
            class="logo"
        >
            Just An Anime Review
        </a>

    </div>

</header>


<main>


    <div id="loading">

        アニメ情報を読み込んでいます……

    </div>


    <div id="error">

        <h1>
            作品が見つかりません
        </h1>

        <p>
            指定されたアニメ情報を取得できませんでした。
        </p>

        <a
            href="anime.html"
            class="back-link"
        >
            ← アニメ一覧へ戻る
        </a>

    </div>


    <article
        id="anime-detail"
        class="anime-detail"
        style="display: none;"
    >


        <h1 id="title"></h1>


        <div
            id="genre"
            class="genre"
        ></div>


        <section class="content-section">

            <h2>
                あらすじ
            </h2>

            <p id="description"></p>

        </section>


        <section class="content-section">

            <h2>
                レビュー
            </h2>

            <p id="review"></p>

        </section>


        <a
            id="official-url"
            class="official-link"
            target="_blank"
            rel="noopener noreferrer"
        >
            公式サイトを見る →
        </a>


        <br>


        <a
            href="anime.html"
            class="back-link"
        >
            ← アニメ一覧へ戻る
        </a>


    </article>


</main>


<footer>

    <div class="footer-inner">

        <h2>
            Just An Anime Review
        </h2>

        <p>
            アニメをもっと深く、もっと面白く。
        </p>

        <p class="copyright">
            © 2026 Just An Anime Review
        </p>

    </div>

</footer>



<script>


/* =========================================
   Supabase設定
========================================= */


const SUPABASE_URL =
    "ここにProject URLを入れる";


const SUPABASE_KEY =
    "ここにPublishable keyを入れる";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   URLから作品IDを取得
========================================= */


const params =
    new URLSearchParams(
        window.location.search
    );


const animeId =
    params.get("id");



/* =========================================
   エラー表示
========================================= */


function showError() {

    document.getElementById("loading")
        .style.display = "none";


    document.getElementById("anime-detail")
        .style.display = "none";


    document.getElementById("error")
        .style.display = "block";

}



/* =========================================
   アニメ詳細取得
========================================= */


async function loadAnime() {


    if (!animeId) {

        showError();

        return;

    }


    try {


        const {
            data,
            error
        } = await supabaseClient

            .from("anime")

            .select(
                "id,title,genre,description,review,official_url"
            )

            .eq(
                "id",
                animeId
            )

            .single();


        if (error || !data) {

            console.error(error);

            showError();

            return;

        }


        document.getElementById("loading")
            .style.display = "none";


        document.getElementById("anime-detail")
            .style.display = "block";


        document.getElementById("title")
            .textContent =
                data.title || "";


        document.getElementById("genre")
            .textContent =
                data.genre || "";


        document.getElementById("description")
            .textContent =
                data.description || "";


        document.getElementById("review")
            .textContent =
                data.review || "";


        const officialUrl =
            document.getElementById(
                "official-url"
            );


        if (data.official_url) {

            officialUrl.href =
                data.official_url;

        } else {

            officialUrl.style.display =
                "none";

        }


        if (data.title) {

            document.title =
                `${data.title} | Just An Anime Review`;

        }


    } catch (err) {


        console.error(err);

        showError();

    }

}



/* =========================================
   実行
========================================= */


loadAnime();


</script>


</body>

</html>
