<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;

    background: #f7f7f7;
    color: #222;
    line-height: 1.7;
}


/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.logo {
    color: white;
    text-decoration: none;
    font-size: 21px;
    font-weight: bold;
}


/* =========================
   MAIN
========================= */

main {
    max-width: 900px;
    margin: auto;
    padding: 45px 20px;
}


/* =========================
   DETAIL
========================= */

.detail-box {
    background: white;
    padding: 40px;
    border-radius: 12px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.08);
}

h1 {
    font-size: 40px;
    line-height: 1.3;
    margin-top: 0;
    margin-bottom: 15px;
}

.genre {
    display: inline-block;

    background: #eee;

    padding: 5px 11px;

    border-radius: 20px;

    font-size: 13px;

    color: #555;
}

section {
    margin-top: 40px;
}

section h2 {
    font-size: 23px;

    border-bottom: 2px solid #eee;

    padding-bottom: 10px;
}

section p {
    white-space: pre-wrap;
    line-height: 2;
    color: #444;
}


/* =========================
   OFFICIAL
========================= */

.official {
    display: inline-block;

    margin-top: 15px;

    padding: 10px 16px;

    background: #111;

    color: white;

    text-decoration: none;

    border-radius: 7px;

    font-weight: bold;
}

.official:hover {
    opacity: .8;
}


/* =========================
   INTERACTION
========================= */

.interaction-section {
    margin-top: 50px;

    padding-top: 35px;

    border-top: 2px solid #eee;
}


/* =========================
   LIKE
========================= */

.like-area {
    display: flex;

    align-items: center;

    gap: 12px;
}

.like-button {
    border: 1px solid #ddd;

    background: white;

    color: #333;

    padding: 10px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 15px;
}

.like-button:hover {
    background: #f5f5f5;
}

.like-button.liked {
    background: #111;

    color: white;

    border-color: #111;
}

.like-button:disabled {
    opacity: .6;

    cursor: not-allowed;
}

.like-count {
    color: #666;

    font-size: 14px;
}


/* =========================
   COMMENT FORM
========================= */

.comment-form {
    margin-top: 35px;
}

.comment-form label {
    display: block;

    margin: 15px 0 7px;

    font-weight: bold;
}

.comment-form input,
.comment-form textarea {
    width: 100%;

    padding: 11px;

    border: 1px solid #ccc;

    border-radius: 7px;

    font-size: 15px;

    font-family: inherit;
}

.comment-form input:focus,
.comment-form textarea:focus {
    outline: none;

    border-color: #555;
}

.comment-form textarea {
    min-height: 110px;

    resize: vertical;

    line-height: 1.7;
}

.comment-submit {
    margin-top: 15px;

    padding: 10px 18px;

    border: none;

    border-radius: 7px;

    background: #111;

    color: white;

    cursor: pointer;

    font-size: 14px;
}

.comment-submit:hover {
    opacity: .85;
}

.comment-submit:disabled {
    opacity: .5;

    cursor: not-allowed;
}

.comment-message {
    margin-top: 12px;

    color: #666;

    font-size: 14px;
}


/* =========================
   COMMENTS
========================= */

.comments {
    margin-top: 35px;
}

.comment-item {
    padding: 18px 0;

    border-bottom: 1px solid #eee;
}

.comment-item:first-child {
    border-top: 1px solid #eee;
}

.comment-header {
    display: flex;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 8px;
}

.comment-nickname {
    font-weight: bold;
}

.comment-date {
    color: #999;

    font-size: 12px;
}

.comment-text {
    white-space: pre-wrap;

    color: #444;

    word-break: break-word;
}

.no-comments {
    color: #888;
}


/* =========================
   BACK
========================= */

.back {
    display: inline-block;

    margin-top: 30px;

    color: #666;

    text-decoration: none;
}

.back:hover {
    text-decoration: underline;
}


/* =========================
   STATUS
========================= */

.status {
    text-align: center;

    padding: 60px 20px;

    color: #666;
}

.error-box {
    background: white;

    padding: 40px;

    border-radius: 12px;

    text-align: center;

    box-shadow:
        0 3px 15px rgba(0,0,0,.08);
}


/* =========================
   FOOTER
========================= */

footer {
    margin-top: 70px;

    background: #111;

    color: white;

    padding: 35px 20px;
}

.footer-inner {
    max-width: 900px;

    margin: auto;
}

.footer-inner p {
    color: #bbb;
}


/* =========================
   ADMIN
========================= */

.admin-link {
    position: fixed;

    right: 12px;

    bottom: 10px;

    font-size: 11px;

    color: #999;

    text-decoration: none;

    opacity: .65;
}

.admin-link:hover {
    opacity: 1;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    main {
        padding: 30px 15px;
    }

    .detail-box {
        padding: 25px 20px;
    }

    h1 {
        font-size: 30px;
    }

    section h2 {
        font-size: 21px;
    }

    .comment-header {
        flex-direction: column;

        gap: 2px;
    }

}

</style>

<main>

style="display:none;">


<h1

<div

class="genre"
style="display:none;">
</div>


<section>

<h2>

<!-- =========================

========================= -->

class="interaction-section">


<h2>

</h2>


<!-- いいね -->

<div class="like-area">

<button
type="button"
id="like-button"
class="like-button">

♡ いいね

</button>

<span
id="like-count"
class="like-count">

</span>

</div>


<!-- コメント投稿 -->

<div class="comment-form">

<h2>

</h2>


<label
for="comment-nickname">

ニックネーム

</label>

<input
type="text"
id="comment-nickname"
maxlength="30"
autocomplete="nickname"
placeholder="ニックネーム">


<label
for="comment-text">

コメント

</label>

<textarea
id="comment-text"
maxlength="1000"
placeholder="この作品についてコメントしてください。"></textarea>


<button
type="button"
id="comment-submit"
class="comment-submit">

コメントを投稿

</button>


<p
id="comment-message"
class="comment-message">
</p>

</div>


<!-- コメント一覧 -->

</h2>

<div id="comment-list">

<!-- 公式サイト -->

id="official"

rel="noopener noreferrer">

class="back">

<p>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   アニメID
========================= */

const animeId =
new URLSearchParams(
window.location.search
).get("id");


/* =========================
   訪問者ID
========================= */

function getVisitorId() {

let visitorId =
localStorage.getItem(
"anime_review_visitor_id"
);


if (!visitorId) {

visitorId =
crypto.randomUUID();

localStorage.setItem(
"anime_review_visitor_id",
visitorId
);

}


return visitorId;

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(value) {

const div =
document.createElement("div");

div.textContent =
value ?? "";

return div.innerHTML;

}


/* =========================
   URL安全確認
========================= */

function isSafeURL(value) {

if (!value) {
return false;
}

try {

const url =
new URL(
value,
window.location.origin
);

return (
url.protocol === "http:" ||
url.protocol === "https:"
);

} catch {

return false;

}

}


/* =========================
   エラー
========================= */

function showError() {

document
.getElementById("loading")
.style.display =
"none";

document
.getElementById("detail")
.style.display =
"none";

document
.getElementById("error")
.style.display =
"block";

}


/* =========================
   アニメ取得
========================= */

async function loadAnime() {

if (!animeId) {

showError();

return false;

}


const {
data,
error
} =
await supabaseClient

.from("anime")

.select(
"id,title,genre,description,review,official_url"
)

.eq(
"id",
animeId
)

.maybeSingle();


if (error) {

console.error(
"アニメ取得エラー:",
error
);

showError();

return false;

}


if (!data) {

showError();

return false;

}


/* =========================
   基本表示
========================= */

const title =
data.title ||
"アニメ作品";


document.title =
`${title} | Just An Anime Review`;


document
.getElementById("title")
.textContent =
title;


const genreElement =
document.getElementById("genre");


if (data.genre) {

genreElement.textContent =
data.genre;

genreElement.style.display =
"inline-block";

}


document
.getElementById("description")
.textContent =
data.description ||
"あらすじは登録されていません。";


document
.getElementById("review")
.textContent =
data.review ||
"レビューは登録されていません。";


/* =========================
   公式サイト
========================= */

const officialWrapper =
document.getElementById(
"official-wrapper"
);

const official =
document.getElementById(
"official"
);


if (
data.official_url &&
isSafeURL(data.official_url)
) {

official.href =
data.official_url;

officialWrapper.style.display =
"block";

} else {

officialWrapper.style.display =
"none";

}


/* =========================
   SEO
========================= */

const description =
(data.description || "")
.replace(/\s+/g, " ")
.trim()
.slice(0, 155);


document
.getElementById("meta-description")
.setAttribute(
"content",
description ||
`${title}のあらすじ・レビューを紹介しています。`
);


const canonical =
window.location.origin +
window.location.pathname +
"?id=" +
encodeURIComponent(
animeId
);


document
.getElementById("canonical")
.setAttribute(
"href",
canonical
);


document
.getElementById("og-title")
.setAttribute(
"content",
`${title} | Just An Anime Review`
);


document
.getElementById("og-description")
.setAttribute(
"content",
description
);


document
.getElementById("og-url")
.setAttribute(
"content",
canonical
);


/* =========================
   表示
========================= */

document
.getElementById("loading")
.style.display =
"none";

document
.getElementById("detail")
.style.display =
"block";


return true;

}


/* =========================
   いいね数
========================= */

async function loadLikeCount() {

const {
count,
error
} =
await supabaseClient

.from("anime_likes")

.select(
"id",
{
count: "exact",
head: true
}
)

.eq(
"anime_id",
animeId
);


if (error) {

console.error(
"いいね数取得エラー:",
error
);

return;

}


document
.getElementById("like-count")
.textContent =
`${count || 0}件`;

}


/* =========================
   いいね状態
========================= */

async function loadLikeStatus() {

const visitorId =
getVisitorId();


const {
data,
error
} =
await supabaseClient

.from("anime_likes")

.select("id")

.eq(
"anime_id",
animeId
)

.eq(
"visitor_id",
visitorId
)

.maybeSingle();


if (error) {

console.error(
"いいね状態取得エラー:",
error
);

return;

}


const button =
document.getElementById(
"like-button"
);


if (data) {

button.classList.add(
"liked"
);

button.textContent =
"♥ いいね済み";

button.disabled =
true;

}

}


/* =========================
   いいね
========================= */

async function addLike() {

const button =
document.getElementById(
"like-button"
);


if (button.disabled) {
return;
}


button.disabled =
true;


const visitorId =
getVisitorId();


/* 二重確認 */

const {
data: existing,
error: checkError
} =
await supabaseClient

.from("anime_likes")

.select("id")

.eq(
"anime_id",
animeId
)

.eq(
"visitor_id",
visitorId
)

.maybeSingle();


if (checkError) {

console.error(
"いいね確認エラー:",
checkError
);

button.disabled =
false;

return;

}


if (existing) {

button.classList.add(
"liked"
);

button.textContent =
"♥ いいね済み";

return;

}


/* 追加 */

const {
error
} =
await supabaseClient

.from("anime_likes")

.insert({

anime_id:
animeId,

visitor_id:
visitorId

});


if (error) {

console.error(
"いいね追加エラー:",
error
);

button.disabled =
false;

alert(
"いいねに失敗しました。"
);

return;

}


button.classList.add(
"liked"
);

button.textContent =
"♥ いいね済み";


await loadLikeCount();

}


/* =========================
   コメント取得
========================= */

async function loadComments() {

const container =
document.getElementById(
"comment-list"
);


const {
data,
error
} =
await supabaseClient

.from("anime_comments")

.select(
"id,nickname,comment,created_at"
)

.eq(
"anime_id",
animeId
)

.order(
"created_at",
{
ascending: false
}
);


if (error) {

console.error(
"コメント取得エラー:",
error
);

container.innerHTML = `

<p class="no-comments">

コメントを取得できませんでした。

</p>

`;

return;

}


if (
!data ||
data.length === 0
) {

container.innerHTML = `

<p class="no-comments">

まだコメントはありません。

</p>

`;

return;

}


container.innerHTML =
"";


data.forEach(
item => {

const element =
document.createElement(
"div"
);


element.className =
"comment-item";


const nickname =
escapeHTML(
item.nickname ||
"名無し"
);


const comment =
escapeHTML(
item.comment ||
""
);


const date =
new Date(
item.created_at
)
.toLocaleString(
"ja-JP"
);


element.innerHTML = `

<div class="comment-header">

<span class="comment-nickname">

${nickname}

</span>

<span class="comment-date">

${escapeHTML(date)}

</span>

</div>

<div class="comment-text">

${comment}

</div>

`;


container.appendChild(
element
);

});

}


/* =========================
   コメント投稿
========================= */

async function submitComment() {

const nicknameInput =
document.getElementById(
"comment-nickname"
);

const commentInput =
document.getElementById(
"comment-text"
);

const message =
document.getElementById(
"comment-message"
);

const button =
document.getElementById(
"comment-submit"
);


const nickname =
nicknameInput.value.trim();

const comment =
commentInput.value.trim();


if (!nickname) {

message.textContent =
"ニックネームを入力してください。";

return;

}


if (!comment) {

message.textContent =
"コメントを入力してください。";

return;

}


if (nickname.length > 30) {

message.textContent =
"ニックネームは30文字以内で入力してください。";

return;

}


if (comment.length > 1000) {

message.textContent =
"コメントは1000文字以内で入力してください。";

return;

}


button.disabled =
true;


message.textContent =
"投稿しています……";


const {
error
} =
await supabaseClient

.from("anime_comments")

.insert({

anime_id:
animeId,

nickname:
nickname,

comment:
comment

});


if (error) {

console.error(
"コメント投稿エラー:",
error
);

message.textContent =
"コメントの投稿に失敗しました。";

button.disabled =
false;

return;

}


/* 成功 */

nicknameInput.value =
"";

commentInput.value =
"";


message.textContent =
"コメントを投稿しました。";


await loadComments();


button.disabled =
false;

}


/* =========================
   イベント
========================= */

document
.getElementById("like-button")
.addEventListener(
"click",
addLike
);


document
.getElementById("comment-submit")
.addEventListener(
"click",
submitComment
);


/* =========================
   起動
========================= */

async function start() {

const success =
await loadAnime();


if (!success) {
return;
}


await loadLikeCount();

await loadLikeStatus();

await loadComments();

}


start();

</script>

</body>
