<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>アニメ詳細 | Just An Anime Review</title>
<meta
id="meta-description"
name="description"
content="アニメ作品のあらすじ・作品情報・レビューをご紹介します。"
>

<meta name="robots" content="index, follow">
<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
background: #f7f7f7;
color: #222;
}

header {
background: #111;
color: white;
}

.header-inner {
max-width: 1000px;
margin: auto;
padding: 20px;
}

.logo {
color: white;
text-decoration: none;
font-size: 21px;
font-weight: bold;
}

main {
max-width: 900px;
margin: auto;
padding: 50px 20px;
}

.detail-box {
background: white;
padding: 35px;
border-radius: 12px;
box-shadow:
0 3px 15px rgba(0,0,0,.08);
}

h1 {
font-size: 40px;
margin-top: 0;
}

.genre {
display: inline-block;
background: #eee;
padding: 6px 12px;
border-radius: 20px;
}

section {
margin-top: 35px;
}

section h2 {
border-bottom: 2px solid #eee;
padding-bottom: 10px;
}

section p {
white-space: pre-wrap;
line-height: 2;
color: #444;
}

.official {
display: inline-block;
margin-top: 20px;
color: #06c;
font-weight: bold;
}

.back {
display: inline-block;
margin-top: 30px;
color: #666;
}

.status {
text-align: center;
padding: 50px;
color: #666;
}

footer {
margin-top: 70px;
background: #111;
color: white;
padding: 35px 20px;
}

.footer-inner {
max-width: 900px;
margin: auto;
}

</style>

</head>

<body>

<header>

<div class="header-inner">

<a href="index.html"
class="logo">

Just An Anime Review

</a>

</div>

</header>


<main>

<div id="loading"
class="status">

読み込んでいます……

</div>


<article
id="detail"
class="detail-box"
style="display:none;">

<h1 id="title"></h1>

<div
id="genre"
class="genre">
</div>


<section>

<h2>
あらすじ
</h2>

<p id="description"></p>

</section>


<section>

<h2>
レビュー
</h2>

<p id="review"></p>

</section>


<a
id="official"
class="official"
target="_blank"
rel="noopener noreferrer">

公式サイトを見る →

</a>


<br>


<a href="anime.html"
class="back">

← アニメ一覧へ戻る

</a>

</article>


</main>


<footer>

<div class="footer-inner">

<h2>
Just An Anime Review
</h2>

<p>
アニメをもっと深く、もっと面白く。
</p>

</div>

</footer>


<script>

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const id =
new URLSearchParams(
location.search
).get("id");


async function loadAnime() {

if (!id) {

showError();

return;

}


const { data, error } =
await supabaseClient
.from("anime")
.select(
"id,title,genre,description,review,official_url"
)
.eq("id",id)
.single();


if (error || !data) {

console.error(error);

showError();

return;

}


document.title =
`${data.title} | Just An Anime Review`;


document.getElementById("title")
.textContent =
data.title || "";


document.getElementById("genre")
.textContent =
data.genre || "";


document.getElementById("description")
.textContent =
data.description || "";


document.getElementById("review")
.textContent =
data.review || "";


const official =
document.getElementById("official");


if (data.official_url) {

official.href =
data.official_url;

} else {

official.style.display =
"none";

}


document.getElementById("loading")
.style.display =
"none";


document.getElementById("detail")
.style.display =
"block";

}


function showError() {

document.getElementById("loading")
.innerHTML = `

<h2>
作品が見つかりません
</h2>

<p>
指定されたアニメは存在しません。
</p>

<a href="anime.html">
アニメ一覧へ戻る
</a>

`;

}


loadAnime();

</script>

</body>

</html>
