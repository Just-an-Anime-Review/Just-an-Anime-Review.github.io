<main>


<!-- =========================
     広告

<section

ADVERTISEMENT

========================= -->

id="loading"
class="status">

アニメ情報を読み込んでいます……

</div>


<!-- =========================

class="error-box"
style="display:none;">

</h1>

</p>

class="back">

========================= -->

<article
id="detail"
class="detail-box"
style="display:none;">

<h1
id="title">
</h1>

class="genre"
style="display:none;">

あらすじ

<a
href="admin.html"
class="admin-link">

管理画面

</a>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================
   URLパラメータ
========================= */

const id =
new URLSearchParams(
window.location.search
).get("id");


/* =========================
   エラー表示
========================= */

function showError() {

document
.getElementById("loading")
.style.display = "none";


document
.getElementById("detail")
.style.display = "none";


document
.getElementById("error")
.style.display = "block";

}


/* =========================
   広告取得
========================= */

async function loadAdvertisement() {

const section =
document.getElementById("ad-section");

const container =
document.getElementById("ad-container");


const { data, error } =
await supabaseClient

.from("advertisements")

.select(
"id,company_name,title,description,image_url,link_url"
)

.eq(
"is_active",
true
)

.order(
"id",
{
ascending: true
}
)

.limit(1);


if (error) {

console.error(
"広告取得エラー:",
error
);

section.style.display =
"none";

return;

}


if (
!data ||
data.length === 0
) {

section.style.display =
"none";

return;

}


const ad =
data[0];


let html = "";


/* 画像 */

if (ad.image_url) {

html += `

<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(
ad.title || "広告"
)}"
onerror="this.style.display='none';"
>

`;

}


/* 企業名 */

if (ad.company_name) {

html += `

<div class="ad-company">

${escapeHTML(
ad.company_name
)}

</div>

`;

}


/* タイトル */

if (ad.title) {

html += `

<div class="ad-title">

${escapeHTML(
ad.title
)}

</div>

`;

}


/* 説明 */

if (ad.description) {

html += `

<div class="ad-description">

${escapeHTML(
ad.description
)}

</div>

`;

}


/* リンク */

if (ad.link_url) {

html += `

<a
class="ad-button"
href="${escapeHTML(
ad.link_url
)}"
target="_blank"
rel="noopener noreferrer">

詳しくはこちら

</a>

`;

}


if (!html) {

section.style.display =
"none";

return;

}


container.innerHTML =
html;


section.style.display =
"block";

}


/* =========================
   アニメ取得
========================= */

async function loadAnime() {

if (!id) {

showError();

return;

}


const { data, error } =
await supabaseClient

.from("anime")

.select(
"id,title,genre,description,review,official_url"
)

.eq(
"id",
id
)

.single();


if (error || !data) {

console.error(
"アニメ取得エラー:",
error
);

showError();

return;

}


/* =========================
   基本情報
========================= */

const title =
data.title || "アニメ作品";


const genre =
data.genre || "";


const description =
data.description || "";


const review =
data.review || "";


/* =========================
   title
========================= */

document.title =
`${title} | Just An Anime Review`;


/* =========================
   description
========================= */

let metaDescription;


if (description) {

metaDescription =
description
.replace(/\s+/g, " ")
.trim()
.slice(0, 155);

} else {

metaDescription =
`${title}のあらすじ・作品情報・レビューを紹介しています。`;

}


document
.getElementById("meta-description")
.setAttribute(
"content",
metaDescription
);


/* =========================
   canonical
========================= */

const canonicalUrl =
window.location.origin +
window.location.pathname +
"?id=" +
encodeURIComponent(data.id);


document
.getElementById("canonical")
.setAttribute(
"href",
canonicalUrl
);


/* =========================
   OGP
========================= */

document
.getElementById("og-title")
.setAttribute(
"content",
`${title} | Just An Anime Review`
);


document
.getElementById("og-description")
.setAttribute(
"content",
metaDescription
);


document
.getElementById("og-url")
.setAttribute(
"content",
canonicalUrl
);


/* =========================
   表示
========================= */

document
.getElementById("title")
.textContent =
title;


const genreElement =
document.getElementById("genre");


if (genre) {

genreElement.textContent =
genre;

genreElement.style.display =
"inline-block";

} else {

genreElement.style.display =
"none";

}


document
.getElementById("description")
.textContent =
description ||
"あらすじは登録されていません。";


document
.getElementById("review")
.textContent =
review ||
"レビューは登録されていません。";


/* =========================
   公式サイト
========================= */

const officialWrapper =
document.getElementById(
"official-wrapper"
);


const official =
document.getElementById(
"official"
);


if (data.official_url) {

official.href =
data.official_url;

officialWrapper.style.display =
"block";

} else {

officialWrapper.style.display =
"none";

}


/* =========================
   構造化データ
========================= */

const structuredData = {

"@context":
"https://schema.org",

"@type":
"Article",

"headline":
title,

"description":
metaDescription,

"url":
canonicalUrl,

"mainEntityOfPage": {

"@type":
"WebPage",

"@id":
canonicalUrl

},

"publisher": {

"@type":
"Organization",

"name":
"Just An Anime Review"

}

};


const oldSchema =
document.getElementById(
"anime-structured-data"
);


if (oldSchema) {

oldSchema.remove();

}


const schemaScript =
document.createElement("script");


schemaScript.type =
"application/ld+json";


schemaScript.id =
"anime-structured-data";


schemaScript.textContent =
JSON.stringify(
structuredData
);


document.head.appendChild(
schemaScript
);


/* =========================
   表示切り替え
========================= */

document
.getElementById("loading")
.style.display =
"none";


document
.getElementById("detail")
.style.display =
"block";

}


/* =========================
   起動
========================= */

loadAnime();

loadAdvertisement();

</script>


</body>

</html>
