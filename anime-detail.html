<script>

/* ==================================================
   Supabase
================================================== */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==================================================
   作品ID
================================================== */

const params =
new URLSearchParams(
    window.location.search
);

const animeId =
params.get("id");


/* ==================================================
   閲覧者ID
================================================== */

function getVisitorId() {

    let visitorId =
        localStorage.getItem(
            "anime_review_visitor_id"
        );

    if (!visitorId) {

        visitorId =
            crypto.randomUUID();

        localStorage.setItem(
            "anime_review_visitor_id",
            visitorId
        );

    }

    return visitorId;
}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


/* ==================================================
   エラー表示
================================================== */

function showError() {

    document.getElementById(
        "loading"
    ).style.display = "none";

    document.getElementById(
        "detail"
    ).style.display = "none";

    document.getElementById(
        "error"
    ).style.display = "block";
}


/* ==================================================
   アニメ取得
================================================== */

async function loadAnime() {

    if (!animeId) {

        showError();
        return;

    }


    const { data, error } =
        await supabaseClient

        .from("anime")

        .select(
            "id,title,genre,description,review,official_url"
        )

        .eq(
            "id",
            animeId
        )

        .maybeSingle();


    if (error) {

        console.error(
            "アニメ取得エラー:",
            error
        );

        showError();
        return;

    }


    if (!data) {

        showError();
        return;

    }


    document.title =
        `${data.title} | Just An Anime Review`;


    document.getElementById(
        "title"
    ).textContent =
        data.title || "アニメ作品";


    const genre =
        document.getElementById("genre");


    if (data.genre) {

        genre.textContent =
            data.genre;

        genre.style.display =
            "inline-block";

    }


    document.getElementById(
        "description"
    ).textContent =
        data.description ||
        "あらすじは登録されていません。";


    document.getElementById(
        "review"
    ).textContent =
        data.review ||
        "レビューは登録されていません。";


    const officialWrapper =
        document.getElementById(
            "official-wrapper"
        );


    const official =
        document.getElementById(
            "official"
        );


    if (data.official_url) {

        official.href =
            data.official_url;

        officialWrapper.style.display =
            "block";

    } else {

        officialWrapper.style.display =
            "none";

    }


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "detail"
    ).style.display =
        "block";


    /*
       作品IDが確定してから
       いいね・コメントを読み込む
    */

    await initializeInteractions();

}


/* ==================================================
   いいね数取得
================================================== */

async function loadLikeCount() {

    const { count, error } =
        await supabaseClient

        .from("anime_likes")

        .select(
            "id",
            {
                count: "exact",
                head: true
            }
        )

        .eq(
            "anime_id",
            animeId
        );


    if (error) {

        console.error(
            "いいね数取得エラー:",
            error
        );

        return;

    }


    document.getElementById(
        "like-count"
    ).textContent =
        `${count ?? 0}件`;

}


/* ==================================================
   いいね状態確認
================================================== */

async function checkLiked() {

    const visitorId =
        getVisitorId();


    const { data, error } =
        await supabaseClient

        .from("anime_likes")

        .select("id")

        .eq(
            "anime_id",
            animeId
        )

        .eq(
            "visitor_id",
            visitorId
        )

        .maybeSingle();


    if (error) {

        console.error(
            "いいね状態取得エラー:",
            error
        );

        return;

    }


    const button =
        document.getElementById(
            "like-button"
        );


    if (data) {

        button.classList.add(
            "liked"
        );

        button.textContent =
            "♥ いいね済み";

        button.disabled =
            true;

    } else {

        button.classList.remove(
            "liked"
        );

        button.textContent =
            "♡ いいね";

        button.disabled =
            false;

    }

}


/* ==================================================
   いいね追加
================================================== */

async function addLike() {

    const button =
        document.getElementById(
            "like-button"
        );


    if (!animeId) {
        return;
    }


    button.disabled =
        true;


    const visitorId =
        getVisitorId();


    /*
       すでにいいねしているか確認
    */

    const { data: existing, error: checkError } =
        await supabaseClient

        .from("anime_likes")

        .select("id")

        .eq(
            "anime_id",
            animeId
        )

        .eq(
            "visitor_id",
            visitorId
        )

        .maybeSingle();


    if (checkError) {

        console.error(
            "いいね確認エラー:",
            checkError
        );

        button.disabled =
            false;

        return;

    }


    if (existing) {

        await checkLiked();

        return;

    }


    /*
       いいね追加
    */

    const { error: insertError } =
        await supabaseClient

        .from("anime_likes")

        .insert({

            anime_id:
                animeId,

            visitor_id:
                visitorId

        });


    if (insertError) {

        console.error(
            "いいね追加エラー:",
            insertError
        );


        /*
           重複などの場合は
           いいね済みとして再確認
        */

        await loadLikeCount();

        await checkLiked();

        return;

    }


    await loadLikeCount();

    await checkLiked();

}


/* ==================================================
   コメント取得
================================================== */

async function loadComments() {

    const container =
        document.getElementById(
            "comment-list"
        );


    const { data, error } =
        await supabaseClient

        .from("anime_comments")

        .select(
            "id,nickname,comment,created_at"
        )

        .eq(
            "anime_id",
            animeId
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "コメント取得エラー:",
            error
        );


        container.innerHTML = `

<p class="no-comments">

コメントを取得できませんでした。

</p>

`;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `

<p class="no-comments">

まだコメントはありません。

</p>

`;

        return;

    }


    container.innerHTML = "";


    data.forEach(
        comment => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "comment-item";


            const date =
                new Date(
                    comment.created_at
                ).toLocaleString(
                    "ja-JP"
                );


            item.innerHTML = `

<div class="comment-header">

<span class="comment-nickname">

${escapeHTML(
    comment.nickname
)}

</span>

<span class="comment-date">

${escapeHTML(
    date
)}

</span>

</div>

<div class="comment-text">

${escapeHTML(
    comment.comment
)}

</div>

`;


            container.appendChild(
                item
            );

        }
    );

}


/* ==================================================
   コメント投稿
================================================== */

async function submitComment() {

    const nicknameInput =
        document.getElementById(
            "comment-nickname"
        );


    const commentInput =
        document.getElementById(
            "comment-text"
        );


    const message =
        document.getElementById(
            "comment-message"
        );


    const button =
        document.getElementById(
            "comment-submit"
        );


    const nickname =
        nicknameInput.value.trim();


    const comment =
        commentInput.value.trim();


    if (!nickname) {

        message.textContent =
            "ニックネームを入力してください。";

        return;

    }


    if (nickname.length > 30) {

        message.textContent =
            "ニックネームは30文字以内で入力してください。";

        return;

    }


    if (!comment) {

        message.textContent =
            "コメントを入力してください。";

        return;

    }


    if (comment.length > 1000) {

        message.textContent =
            "コメントは1000文字以内で入力してください。";

        return;

    }


    button.disabled =
        true;


    message.textContent =
        "投稿しています……";


    const { error } =
        await supabaseClient

        .from("anime_comments")

        .insert({

            anime_id:
                animeId,

            nickname:
                nickname,

            comment:
                comment

        });


    if (error) {

        console.error(
            "コメント投稿エラー:",
            error
        );


        message.textContent =
            "コメントの投稿に失敗しました。";


        button.disabled =
            false;

        return;

    }


    nicknameInput.value =
        "";

    commentInput.value =
        "";


    message.textContent =
        "コメントを投稿しました。";


    await loadComments();


    button.disabled =
        false;

}


/* ==================================================
   初期化
================================================== */

async function initializeInteractions() {

    await loadLikeCount();

    await checkLiked();

    await loadComments();

}


/* ==================================================
   イベント
================================================== */

document.getElementById(
    "like-button"
).addEventListener(
    "click",
    addLike
);


document.getElementById(
    "comment-submit"
).addEventListener(
    "click",
    submitComment
);


/* ==================================================
   起動
================================================== */

loadAnime();

</script>

</body>

</html>
```
