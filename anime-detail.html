<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


/* =========================
   URLパラメータ
========================= */

const id =
new URLSearchParams(
window.location.search
).get("id");


/* =========================
   エラー表示
========================= */

function showError() {

document
.getElementById("loading")
.style.display =
"none";


document
.getElementById("detail")
.style.display =
"none";


document
.getElementById("error")
.style.display =
"block";

}


/* =========================
   広告URL安全確認
========================= */

function isSafeURL(url) {

if (!url) {

return false;

}

try {

const parsed =
new URL(
url,
window.location.origin
);

return (
parsed.protocol === "http:" ||
parsed.protocol === "https:"
);

} catch {

return false;

}

}


/* =========================
   広告取得
========================= */

async function loadAdvertisement() {

const section =
document.getElementById(
"ad-section"
);

const container =
document.getElementById(
"ad-container"
);


section.style.display =
"none";

container.innerHTML =
"";


try {

const { data, error } =
await supabaseClient

.from("advertisements")

.select(
"id,company_name,title,description,image_url,link_url"
)

.eq(
"is_active",
true
)

.order(
"id",
{
ascending: true
}
)

.limit(1);


if (error) {

console.error(
"広告取得エラー:",
error
);

return;

}


if (
!data ||
data.length === 0
) {

return;

}


const ad =
data[0];


let html = "";


/* 画像 */

if (
ad.image_url &&
isSafeURL(ad.image_url)
) {

html += `

<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(
ad.title || "広告"
)}"
loading="lazy"
onerror="this.style.display='none';">

`;

}


/* 企業名 */

if (ad.company_name) {

html += `

<div class="ad-company">

${escapeHTML(
ad.company_name
)}

</div>

`;

}


/* タイトル */

if (ad.title) {

html += `

<div class="ad-title">

${escapeHTML(
ad.title
)}

</div>

`;

}


/* 説明 */

if (ad.description) {

html += `

<div class="ad-description">

${escapeHTML(
ad.description
)}

</div>

`;

}


/* リンク */

if (
ad.link_url &&
isSafeURL(ad.link_url)
) {

html += `

<a
class="ad-button"
href="${escapeHTML(ad.link_url)}"
target="_blank"
rel="noopener noreferrer nofollow">

詳しくはこちら

</a>

`;

}


if (!html.trim()) {

return;

}


container.innerHTML =
html;

section.style.display =
"block";


} catch (error) {

console.error(
"広告読み込みエラー:",
error
);

}

}


/* =========================
   アニメ取得
========================= */

async function loadAnime() {

if (!id) {

showError();

return;

}


const { data, error } =
await supabaseClient

.from("anime")

.select(
"id,title,genre,description,review,official_url"
)

.eq(
"id",
id
)

.single();


if (error || !data) {

console.error(
"アニメ取得エラー:",
error
);

showError();

return;

}


/* =========================
   基本情報
========================= */

const title =
data.title ||
"アニメ作品";


const genre =
data.genre ||
"";


const description =
data.description ||
"";


const review =
data.review ||
"";


/* =========================
   title
========================= */

document.title =
`${title} | Just An Anime Review`;


/* =========================
   description
========================= */

let metaDescription;


if (description) {

metaDescription =
description
.replace(/\s+/g, " ")
.trim()
.slice(0, 155);

} else {

metaDescription =
`${title}のあらすじ・作品情報・レビューを紹介しています。`;

}


document
.getElementById(
"meta-description"
)
.setAttribute(
"content",
metaDescription
);


/* =========================
   canonical
========================= */

const canonicalUrl =
window.location.origin +
window.location.pathname +
"?id=" +
encodeURIComponent(
data.id
);


document
.getElementById("canonical")
.setAttribute(
"href",
canonicalUrl
);


/* =========================
   OGP
========================= */

document
.getElementById("og-title")
.setAttribute(
"content",
`${title} | Just An Anime Review`
);


document
.getElementById("og-description")
.setAttribute(
"content",
metaDescription
);


document
.getElementById("og-url")
.setAttribute(
"content",
canonicalUrl
);


/* =========================
   表示
========================= */

document
.getElementById("title")
.textContent =
title;


const genreElement =
document.getElementById(
"genre"
);


if (genre) {

genreElement.textContent =
genre;

genreElement.style.display =
"inline-block";

} else {

genreElement.style.display =
"none";

}


document
.getElementById("description")
.textContent =
description ||
"あらすじは登録されていません。";


document
.getElementById("review")
.textContent =
review ||
"レビューは登録されていません。";


/* =========================
   公式サイト
========================= */

const officialWrapper =
document.getElementById(
"official-wrapper"
);


const official =
document.getElementById(
"official"
);


if (
data.official_url &&
isSafeURL(data.official_url)
) {

official.href =
data.official_url;

officialWrapper.style.display =
"block";

} else {

officialWrapper.style.display =
"none";

}


/* =========================
   構造化データ
========================= */

const structuredData = {

"@context":
"https://schema.org",

"@type":
"Article",

"headline":
title,

"description":
metaDescription,

"url":
canonicalUrl,

"mainEntityOfPage": {

"@type":
"WebPage",

"@id":
canonicalUrl

},

"publisher": {

"@type":
"Organization",

"name":
"Just An Anime Review"

}

};


const oldSchema =
document.getElementById(
"anime-structured-data"
);


if (oldSchema) {

oldSchema.remove();

}


const schemaScript =
document.createElement(
"script"
);


schemaScript.type =
"application/ld+json";


schemaScript.id =
"anime-structured-data";


schemaScript.textContent =
JSON.stringify(
structuredData
);


document.head.appendChild(
schemaScript
);


/* =========================
   表示切り替え
========================= */

document
.getElementById("loading")
.style.display =
"none";


document
.getElementById("detail")
.style.display =
"block";


/* =========================
   いいね・コメント開始
========================= */

initializeInteractions();

}


/* =========================
   閲覧者ID
========================= */

function getVisitorId() {

let visitorId =
localStorage.getItem(
"anime_review_visitor_id"
);


if (!visitorId) {

visitorId =
crypto.randomUUID();

localStorage.setItem(
"anime_review_visitor_id",
visitorId
);

}


return visitorId;

}


/* =========================
   いいね数
========================= */

async function loadLikeCount() {

if (!currentAnimeId) {

return;

}


const { count, error } =
await supabaseClient

.from("anime_likes")

.select(
"*",
{
count: "exact",
head: true
}
)

.eq(
"anime_id",
currentAnimeId
);


if (error) {

console.error(
"いいね数取得エラー:",
error
);

return;

}


document
.getElementById("like-count")
.textContent =
`${count || 0}件`;

}


/* =========================
   いいね済み確認
========================= */

async function checkLiked() {

if (!currentAnimeId) {

return;

}


const visitorId =
getVisitorId();


const { data, error } =
await supabaseClient

.from("anime_likes")

.select("id")

.eq(
"anime_id",
currentAnimeId
)

.eq(
"visitor_id",
visitorId
)

.maybeSingle();


if (error) {

console.error(
"いいね状態取得エラー:",
error
);

return;

}


const button =
document.getElementById(
"like-button"
);


if (data) {

button.classList.add(
"liked"
);

button.textContent =
"♥ いいね済み";

button.disabled =
true;

} else {

button.classList.remove(
"liked"
);

button.textContent =
"♡ いいね";

}

}


/* =========================
   いいね
========================= */

async function toggleLike() {

if (!currentAnimeId) {

return;

}


const button =
document.getElementById(
"like-button"
);


const visitorId =
getVisitorId();


button.disabled =
true;


const { data, error } =
await supabaseClient

.from("anime_likes")

.select("id")

.eq(
"anime_id",
currentAnimeId
)

.eq(
"visitor_id",
visitorId
)

.maybeSingle();


if (error) {

console.error(
error
);

button.disabled =
false;

return;

}


/* すでにいいね済み */

if (data) {

button.classList.add(
"liked"
);

button.textContent =
"♥ いいね済み";

button.disabled =
true;

return;

}


/* いいね追加 */

const { error: insertError } =
await supabaseClient

.from("anime_likes")

.insert({

anime_id:
currentAnimeId,

visitor_id:
visitorId

});


if (insertError) {

console.error(
"いいね追加エラー:",
insertError
);


/*
   同時操作などで
   unique制約に引っかかった場合も
   いいね済みとして扱う
*/

await loadLikeCount();

await checkLiked();

return;

}


await loadLikeCount();

await checkLiked();

}


/* =========================
   コメント取得
========================= */

async function loadComments() {

if (!currentAnimeId) {

return;

}


const container =
document.getElementById(
"comment-list"
);


const { data, error } =
await supabaseClient

.from("anime_comments")

.select(
"id,nickname,comment,created_at"
)

.eq(
"anime_id",
currentAnimeId
)

.order(
"created_at",
{
ascending: false
}
);


if (error) {

console.error(
"コメント取得エラー:",
error
);


container.innerHTML = `

<p class="no-comments">

コメントを取得できませんでした。

</p>

`;

return;

}


if (
!data ||
data.length === 0
) {

container.innerHTML = `

<p class="no-comments">

まだコメントはありません。

</p>

`;

return;

}


container.innerHTML =
"";


data.forEach(
comment => {

const item =
document.createElement(
"div"
);


item.className =
"comment-item";


const date =
new Date(
comment.created_at
)
.toLocaleString(
"ja-JP"
);


item.innerHTML = `

/* =========================
   コメント投稿
========================= */

async function submitComment() {

if (!currentAnimeId) {

return;

}


const nickname =
document
.getElementById(
"comment-nickname"
)
.value
.trim();


const comment =
document
.getElementById(
"comment-text"
)
.value
.trim();


const message =
document.getElementById(
"comment-message"
);


const button =
document.getElementById(
"comment-submit"
);


if (!nickname) {

message.textContent =
"ニックネームを入力してください。";

return;

}


if (nickname.length > 30) {

message.textContent =
"ニックネームは30文字以内で入力してください。";

return;

}


if (!comment) {

message.textContent =
"コメントを入力してください。";

return;

}


if (comment.length > 1000) {

message.textContent =
"コメントは1000文字以内で入力してください。";

return;

}


button.disabled =
true;


message.textContent =
"投稿しています……";


const { error } =
await supabaseClient

.from("anime_comments")

.insert({

anime_id:
currentAnimeId,

nickname:
nickname,

comment:
comment

});


if (error) {

console.error(
"コメント投稿エラー:",
error
);

message.textContent =
"コメントの投稿に失敗しました。";

button.disabled =
false;

return;

}


/* 入力欄をクリア */

document
.getElementById(
"comment-nickname"
)
.value =
"";


document
.getElementById(
"comment-text"
)
.value =
"";


message.textContent =
"コメントを投稿しました。";


await loadComments();


button.disabled =
false;

}
