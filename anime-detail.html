<script>

/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";


/* =========================================
   閲覧者ID
========================================= */

function getVisitorId() {

    let visitorId =
        localStorage.getItem(
            "anime_review_visitor_id"
        );

    if (!visitorId) {

        visitorId =
            crypto.randomUUID();

        localStorage.setItem(
            "anime_review_visitor_id",
            visitorId
        );

    }

    return visitorId;

}


const visitorId =
    getVisitorId();


/* =========================================
   Supabaseクライアント
========================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            global: {
                headers: {
                    "x-visitor-id":
                        visitorId
                }
            }
        }
    );


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* =========================================
   URLパラメータ
========================================= */

const currentAnimeId =
    new URLSearchParams(
        window.location.search
    ).get("id");


/* =========================================
   SEO：canonical URL
========================================= */

if (currentAnimeId) {

    const canonicalUrl =
        window.location.origin +
        window.location.pathname +
        "?id=" +
        encodeURIComponent(
            currentAnimeId
        );

    document
        .getElementById("canonical")
        .setAttribute(
            "href",
            canonicalUrl
        );

    document
        .getElementById("og-url")
        .setAttribute(
            "content",
            canonicalUrl
        );

}


/* =========================================
   URL安全確認
========================================= */

function isSafeURL(url) {

    if (!url) {
        return false;
    }

    try {

        const parsed =
            new URL(
                url,
                window.location.origin
            );

        return (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        );

    } catch {

        return false;

    }

}


/* =========================================
   エラー表示
========================================= */

function showError() {

    document
        .getElementById("loading")
        .style.display =
        "none";

    document
        .getElementById("detail")
        .style.display =
        "none";

    document
        .getElementById("error")
        .style.display =
        "block";

}


/* =========================================
   広告
========================================= */

async function loadAdvertisement() {

    const section =
        document.getElementById(
            "ad-section"
        );

    const container =
        document.getElementById(
            "ad-container"
        );

    section.style.display =
        "none";

    container.innerHTML =
        "";

    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from("advertisements")

                .select(
                    "id,company_name,title,description,image_url,link_url"
                )

                .eq(
                    "is_active",
                    true
                )

                .order(
                    "id",
                    {
                        ascending: true
                    }
                )

                .limit(1);


        if (error) {

            console.error(
                "広告取得エラー:",
                error
            );

            return;

        }


        if (
            !data ||
            !data.length
        ) {

            return;

        }


        const ad =
            data[0];

        let html =
            "";


        if (
            ad.image_url &&
            isSafeURL(ad.image_url)
        ) {

            html += `

                <img
                    src="${escapeHTML(ad.image_url)}"
                    alt="${escapeHTML(
                        ad.title || "広告"
                    )}"
                    loading="lazy"
                    onerror="this.style.display='none';">

            `;

        }


        if (ad.company_name) {

            html += `

                <div class="ad-company">

                    ${escapeHTML(
                        ad.company_name
                    )}

                </div>

            `;

        }


        if (ad.title) {

            html += `

                <div class="ad-title">

                    ${escapeHTML(
                        ad.title
                    )}

                </div>

            `;

        }


        if (ad.description) {

            html += `

                <div class="ad-description">

                    ${escapeHTML(
                        ad.description
                    )}

                </div>

            `;

        }


        if (
            ad.link_url &&
            isSafeURL(ad.link_url)
        ) {

            html += `

                <a
                    class="ad-button"
                    href="${escapeHTML(ad.link_url)}"
                    target="_blank"
                    rel="noopener noreferrer nofollow">

                    詳しくはこちら

                </a>

            `;

        }


        if (!html.trim()) {

            return;

        }


        container.innerHTML =
            html;

        section.style.display =
            "block";


    } catch (error) {

        console.error(
            "広告読み込みエラー:",
            error
        );

    }

}


/* =========================================
   アニメ取得
========================================= */

async function loadAnime() {

    if (!currentAnimeId) {

        showError();

        return;

    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from("anime")

                .select(
                    "id,title,genre,description,review,official_url"
                )

                .eq(
                    "id",
                    currentAnimeId
                )

                .single();


        if (error || !data) {

            console.error(
                "アニメ取得エラー:",
                error
            );

            showError();

            return;

        }


        const title =
            data.title ||
            "アニメ作品";


        const genre =
            data.genre ||
            "";


        const description =
            data.description ||
            "";


        const review =
            data.review ||
            "";


        /* =========================
           SEO：ページタイトル
        ========================= */

        document.title =
            `${title}｜レビュー・あらすじ・感想・評価 | Just An Anime Review`;


        const metaDescription =
            description
                ?
                description
                    .replace(/\s+/g, " ")
                    .trim()
                    .slice(0, 155)
                :
                `${title}のあらすじ・作品情報・レビューを紹介しています。`;


        document
            .getElementById(
                "meta-description"
            )
            .setAttribute(
                "content",
                metaDescription
            );


        const canonicalUrl =
            window.location.origin +
            window.location.pathname +
            "?id=" +
            encodeURIComponent(
                data.id
            );


        document
            .getElementById("canonical")
            .setAttribute(
                "href",
                canonicalUrl
            );


        /* =========================
           SEO：OGPタイトル
        ========================= */

        document
            .getElementById("og-title")
            .setAttribute(
                "content",
                `${title}｜レビュー・あらすじ・感想・評価 | Just An Anime Review`
            );


        document
            .getElementById("og-description")
            .setAttribute(
                "content",
                metaDescription
            );


        document
            .getElementById("og-url")
            .setAttribute(
                "content",
                canonicalUrl
            );


        document
            .getElementById("title")
            .textContent =
            title;


        const genreElement =
            document.getElementById(
                "genre"
            );


        if (genre) {

            genreElement.textContent =
                genre;

            genreElement.style.display =
                "inline-block";

        } else {

            genreElement.style.display =
                "none";

        }


        document
            .getElementById("description")
            .textContent =
            description ||
            "あらすじは登録されていません。";


        document
            .getElementById("review")
            .textContent =
            review ||
            "レビューは登録されていません。";


        const officialWrapper =
            document.getElementById(
                "official-wrapper"
            );


        const official =
            document.getElementById(
                "official"
            );


        if (
            data.official_url &&
            isSafeURL(data.official_url)
        ) {

            official.href =
                data.official_url;

            officialWrapper.style.display =
                "block";

        } else {

            officialWrapper.style.display =
                "none";

        }


        /* =========================
           構造化データ
        ========================= */

        const structuredData = {

            "@context":
                "https://schema.org",

            "@type":
                "Article",

            "headline":
                title,

            "description":
                metaDescription,

            "url":
                canonicalUrl,

            "inLanguage":
                "ja",

            "about": {

                "@type":
                    "TVSeries",

                "name":
                    title

            },

            "mainEntityOfPage": {

                "@type":
                    "WebPage",

                "@id":
                    canonicalUrl

            },

            "publisher": {

                "@type":
                    "Organization",

                "name":
                    "Just An Anime Review",

                "url":
                    "https://just-an-anime-review.github.io/"

            }

        };


        if (genre) {

            structuredData.about.genre =
                genre;

        }


        const oldSchema =
            document.getElementById(
                "anime-structured-data"
            );


        if (oldSchema) {

            oldSchema.remove();

        }


        const schemaScript =
            document.createElement(
                "script"
            );


        schemaScript.type =
            "application/ld+json";


        schemaScript.id =
            "anime-structured-data";


        schemaScript.textContent =
            JSON.stringify(
                structuredData
            );


        document.head.appendChild(
            schemaScript
        );


        /* =========================
           表示
        ========================= */

        document
            .getElementById("loading")
            .style.display =
            "none";


        document
            .getElementById("detail")
            .style.display =
            "block";


        await initializeInteractions();


    } catch (error) {

        console.error(
            "アニメ読み込みエラー:",
            error
        );

        showError();

    }

}


/* =========================================
   いいね数取得
========================================= */

async function loadLikeCount() {

    const {
        count,
        error
    } =
        await supabaseClient

            .from("anime_likes")

            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )

            .eq(
                "anime_id",
                currentAnimeId
            );


    if (error) {

        console.error(
            "いいね数取得エラー:",
            error
        );

        return;

    }


    document
        .getElementById("like-count")
        .textContent =
        `${count || 0}件`;

}


/* =========================================
   自分のいいね確認
========================================= */

async function checkLiked() {

    const {
        data,
        error
    } =
        await supabaseClient

            .from("anime_likes")

            .select("id")

            .eq(
                "anime_id",
                currentAnimeId
            )

            .eq(
                "visitor_id",
                visitorId
            )

            .maybeSingle();


    if (error) {

        console.error(
            "いいね状態取得エラー:",
            error
        );

        return;

    }


    const button =
        document.getElementById(
            "like-button"
        );


    if (data) {

        button.classList.add(
            "liked"
        );

        button.textContent =
            "♥ いいね済み";

    } else {

        button.classList.remove(
            "liked"
        );

        button.textContent =
            "♡ いいね";

    }

}


/* =========================================
   いいね追加・削除
========================================= */

async function toggleLike() {

    const button =
        document.getElementById(
            "like-button"
        );


    button.disabled =
        true;


    const {
        data,
        error
    } =
        await supabaseClient

            .from("anime_likes")

            .select("id")

            .eq(
                "anime_id",
                currentAnimeId
            )

            .eq(
                "visitor_id",
                visitorId
            )

            .maybeSingle();


    if (error) {

        console.error(
            "いいね確認エラー:",
            error
        );

        button.disabled =
            false;

        return;

    }


    if (data) {

        const {
            error: deleteError
        } =
            await supabaseClient

                .from("anime_likes")

                .delete()

                .eq(
                    "id",
                    data.id
                )

                .eq(
                    "visitor_id",
                    visitorId
                );


        if (deleteError) {

            console.error(
                "いいね削除エラー:",
                deleteError
            );

            button.disabled =
                false;

            return;

        }

    } else {

        const {
            error: insertError
        } =
            await supabaseClient

                .from("anime_likes")

                .insert({

                    anime_id:
                        currentAnimeId,

                    visitor_id:
                        visitorId

                });


        if (insertError) {

            console.error(
                "いいね追加エラー:",
                insertError
            );

            button.disabled =
                false;

            return;

        }

    }


    await loadLikeCount();

    await checkLiked();


    button.disabled =
        false;

}


/* =========================================
   コメント取得
========================================= */

async function loadComments() {

    const container =
        document.getElementById(
            "comment-list"
        );


    const {
        data,
        error
    } =
        await supabaseClient

            .from("anime_comments")

            .select(
                "id,anime_id,nickname,comment,created_at,visitor_id"
            )

            .eq(
                "anime_id",
                currentAnimeId
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "コメント取得エラー:",
            error
        );

        container.innerHTML = `

            <p class="no-comments">

                コメントを取得できませんでした。

            </p>

        `;

        return;

    }


    if (
        !data ||
        !data.length
    ) {

        container.innerHTML = `

            <p class="no-comments">

                まだコメントはありません。

            </p>

        `;

        return;

    }


    container.innerHTML =
        "";


    data.forEach(
        comment => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "comment-item";


            const date =
                new Date(
                    comment.created_at
                )
                    .toLocaleString(
                        "ja-JP"
                    );


            const isOwn =
                comment.visitor_id ===
                visitorId;


            item.innerHTML = `

                <div class="comment-header">

                    <span class="comment-nickname">

                        ${escapeHTML(
                            comment.nickname
                        )}

                    </span>

                    <span class="comment-date">

                        ${escapeHTML(
                            date
                        )}

                    </span>

                </div>


                <div class="comment-text">

                    ${escapeHTML(
                        comment.comment
                    )}

                </div>


                ${
                    isOwn
                        ?
                        `

                            <div class="comment-actions">

                                <button
                                    type="button"
                                    class="comment-delete">

                                    コメントを削除

                                </button>

                            </div>

                        `
                        :
                        ""
                }

            `;


            if (isOwn) {

                item
                    .querySelector(
                        ".comment-delete"
                    )
                    .addEventListener(
                        "click",
                        () =>
                            deleteComment(
                                comment.id
                            )
                    );

            }


            container.appendChild(
                item
            );

        }
    );

}


/* =========================================
   コメント投稿
========================================= */

async function submitComment() {

    const nickname =
        document
            .getElementById(
                "comment-nickname"
            )
            .value
            .trim();


    const comment =
        document
            .getElementById(
                "comment-text"
            )
            .value
            .trim();


    const message =
        document.getElementById(
            "comment-message"
        );


    const button =
        document.getElementById(
            "comment-submit"
        );


    if (!nickname) {

        message.textContent =
            "ニックネームを入力してください。";

        return;

    }


    if (nickname.length > 30) {

        message.textContent =
            "ニックネームは30文字以内で入力してください。";

        return;

    }


    if (!comment) {

        message.textContent =
            "コメントを入力してください。";

        return;

    }


    if (comment.length > 1000) {

        message.textContent =
            "コメントは1000文字以内で入力してください。";

        return;

    }


    button.disabled =
        true;


    message.textContent =
        "投稿しています……";


    const {
        error
    } =
        await supabaseClient

            .from("anime_comments")

            .insert({

                anime_id:
                    currentAnimeId,

                visitor_id:
                    visitorId,

                nickname:
                    nickname,

                comment:
                    comment

            });


    if (error) {

        console.error(
            "コメント投稿エラー:",
            error
        );

        message.textContent =
            "コメントの投稿に失敗しました。";

        button.disabled =
            false;

        return;

    }


    document
        .getElementById(
            "comment-nickname"
        )
        .value =
        "";


    document
        .getElementById(
            "comment-text"
        )
        .value =
        "";


    message.textContent =
        "コメントを投稿しました。";


    await loadComments();


    button.disabled =
        false;

}


/* =========================================
   コメント削除
========================================= */

async function deleteComment(
    commentId
) {

    const ok =
        confirm(
            "このコメントを削除しますか？"
        );


    if (!ok) {

        return;

    }


    const {
        error
    } =
        await supabaseClient

            .from("anime_comments")

            .delete()

            .eq(
                "id",
                commentId
            )

            .eq(
                "visitor_id",
                visitorId
            );


    if (error) {

        console.error(
            "コメント削除エラー:",
            error
        );

        alert(
            "コメントの削除に失敗しました。"
        );

        return;

    }


    await loadComments();

}


/* =========================================
   インタラクション初期化
========================================= */

async function initializeInteractions() {

    await loadLikeCount();

    await checkLiked();

    await loadComments();

}


/* =========================================
   イベント
========================================= */

document
    .getElementById(
        "like-button"
    )
    .addEventListener(
        "click",
        toggleLike
    );


document
    .getElementById(
        "comment-submit"
    )
    .addEventListener(
        "click",
        submitComment
    );


/* =========================================
   起動
========================================= */

loadAnime();

loadAdvertisement();

</script>
